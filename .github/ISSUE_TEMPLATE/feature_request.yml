name: Feature request
description: Propose a reusable capability for the expansion framework.
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the capability and why it belongs in a reusable FE8 expansion framework.
        Project-specific content or rulesets may be redirected to a downstream extension seam.
        Propose at least one tester-facing case. The canonical indexed catalog is tracked by
        https://github.com/laqieer/fireemblem8-expansion/issues/54.
  - type: textarea
    id: feature_description
    attributes:
      label: Detailed feature description
      description: Explain the behavior, user-facing result, and intended integration surface.
      placeholder: Describe what should exist and how projects would use it.
    validations:
      required: true
  - type: textarea
    id: request_reason
    attributes:
      label: Request reason
      description: Explain the problem this solves and why the framework should own it.
      placeholder: Why is this useful, and why is an external project-only implementation insufficient?
    validations:
      required: true
  - type: textarea
    id: use_cases
    attributes:
      label: Reusable use cases
      description: Give at least two plausible project uses without hard-coded characters, chapters, assets, or balance values.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: dependencies_conflicts
    attributes:
      label: Dependencies and conflicts
      description: List prerequisites, dependent features, shared runtime/data seams, incompatible profiles, and known conflicts. Write "None known" only after checking.
      placeholder: |
        Dependencies:
        Dependents:
        Conflicts:
        Shared IDs/data/save/config/runtime surfaces:
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration and compatibility
      description: Describe default behavior, any optional build profile/gate, and save, generated-data, debug/release, ROM/RAM, or archival-lane impact.
      placeholder: |
        Default behavior:
        Optional configuration:
        Compatibility/resource impact:
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Observable acceptance criteria
      description: List measurable outcomes and the runtime or host evidence that should prove each one.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: tester_cases
    attributes:
      label: Proposed tester-facing cases
      description: >
        Define at least one stable case ID and linked issue. Include the supported source configuration/profile
        or optional artifact; prerequisites and clean starting state; exact actions/inputs; observable expected
        result; default/disabled negative control or why none applies; dependencies/conflicts/interactions and
        save expectations; deterministic host/ROM automation mapping or a precise manual-only visual/audio/UX
        reason; reset/cleanup; limitations and unsupported configurations. IDs must not be silently renumbered
        or reused. The canonical catalog is tracked by issue #54.
      placeholder: |
        Case ID: TC-AREA-001
        Linked issue: this issue
        Configuration/profile or artifact:
        Prerequisites and clean starting state:
        Actions/inputs:
        Observable expected result:
        Default/disabled negative control:
        Dependencies/conflicts/interactions and save expectations:
        Automation mapping or precise manual-only reason:
        Reset/cleanup:
        Limitations/unsupported configurations:
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: State related behavior that should remain outside this request.
  - type: checkboxes
    id: submission_checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions for duplicates.
          required: true
        - label: I described a reusable framework capability rather than only project-specific content.
          required: true
        - label: I proposed at least one stable tester-facing case and mapped every deterministic assertion to automation or named a precise manual-only criterion.
          required: true
        - label: I did not attach ROMs, saves, savestates, patches, or copyrighted game assets.
          required: true
