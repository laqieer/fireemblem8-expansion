name: Bug report
description: Report a reproducible defect or regression in the expansion framework.
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Preserve the failing evidence and provide enough configuration detail to reproduce the same build.
        Propose a post-fix tester-facing regression case in addition to the deterministic reproduction.
        The canonical indexed catalog is tracked by https://github.com/laqieer/fireemblem8-expansion/issues/54.
        Do not attach ROMs, saves, savestates, patches, or copyrighted game assets.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Provide the full commit ID or branch tip where the bug occurs.
      placeholder: 40-character Git commit ID
    validations:
      required: true
  - type: textarea
    id: build_config
    attributes:
      label: Detailed build configuration
      description: Include the configure command or Make overrides, MODERN_CONFIG, MODERN_ABI, locales, feature flags, ID caps, ROM size, and any non-default settings.
      placeholder: |
        ./configure ...
        make ...
        MODERN_CONFIG=
        MODERN_ABI=
        Locales/features/caps:
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and tools
      description: Include host OS, compiler/binutils versions, emulator/backend, debugger, and any IDA/Ghidra tooling used.
      placeholder: |
        OS:
        arm-none-eabi-gcc:
        Emulator/libmGBA:
        GDB/IDA/Ghidra:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest deterministic sequence from a clean checkout/build to the failure.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the intended observable result.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: State what happened instead, including exact errors or incorrect game state.
    validations:
      required: true
  - type: textarea
    id: regression_case
    attributes:
      label: Proposed tester-facing regression case
      description: >
        Define a stable case ID linked to this bug issue. Include the supported source configuration/profile or
        optional artifact; prerequisites and clean starting state; exact actions/inputs; observable post-fix
        result; the pre-fix behavior as the negative control; dependencies/conflicts/interactions and save
        expectations; deterministic host/ROM automation mapping or a precise manual-only visual/audio/UX reason;
        reset/cleanup; limitations and unsupported configurations. This complements rather than replaces the
        reproduction above. The canonical catalog is tracked by issue #54.
      placeholder: |
        Case ID: TC-AREA-001
        Linked issue: this issue
        Configuration/profile or artifact:
        Prerequisites and clean starting state:
        Actions/inputs:
        Observable post-fix result:
        Pre-fix negative control:
        Dependencies/conflicts/interactions and save expectations:
        Automation mapping or precise manual-only reason:
        Reset/cleanup:
        Limitations/unsupported configurations:
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Game screenshots
      description: Upload screenshots that show the bug and relevant on-screen context. If capture is impossible, attach an explanatory image or state why in the logs field.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostic evidence
      description: Add test output, scenario/fingerprint failures, debugger observations, or an explanation if screenshots cannot be captured. Do not include credentials or restricted ROM data.
      render: shell
  - type: checkboxes
    id: submission_checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions for duplicates.
          required: true
        - label: I reproduced this from a clean checkout or explained why that was impossible.
          required: true
        - label: I preserved the failing evidence instead of refreshing or weakening an oracle.
          required: true
        - label: I proposed a stable post-fix regression case without replacing the deterministic reproduction.
          required: true
        - label: I did not attach ROMs, saves, savestates, patches, or copyrighted game assets.
          required: true
