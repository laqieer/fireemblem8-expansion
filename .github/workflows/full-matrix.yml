name: Full Matrix CI

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-master
  cancel-in-progress: true

jobs:
  host:
    # Every Matrix job is master-only. Build CI owns candidate evidence.
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact master revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Log and verify tested revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Run CJK font gates
        run: |
          make -f cjk_fonts.mk cjk-fonts-check cjk-fonts-test

      - name: Run remaining texttools codec gates
        run: |
          python3 -m unittest discover -s scripts/texttools/tests -p 'test_multilang_codec*.py' -v

      - name: Run configuration and linker-budget gates
        run: |
          python3 -m unittest discover -s scripts/modernize/tests -p 'test_expansion_config.py' -v
          python3 -m unittest discover -s scripts/linker_report/tests -p 'test_*.py' -v

  modern:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]

    steps:
      - name: Checkout exact master revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Log and verify tested revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install modern toolchain and runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev gcc-arm-none-eabi libnewlib-arm-none-eabi libmgba-dev && python -m pip install ttp numpy pillow

      - name: Build tools
        run: ./build_tools.sh

      - name: Run canonical modern linker/runtime gate
        run: make expansion-modern-linker-check MODERN_CONFIG=${{ matrix.config }} MODERN_ABI=aapcs

  legacy:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGBCC_COMMIT: da598c1d918402c42c0c0d7128ba14567f3175e9
      MGFEMBP_AGBCC_COMMIT: 63b22f3eb8a8051af30bd80c4795b355e439e7ef

    steps:
      - name: Checkout exact master revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Log and verify tested revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install archival build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev pkg-config python3-pip python3-numpy python3-pil

      - name: Preflight archival toolchain executables
        run: |
          set -euo pipefail
          command -v arm-none-eabi-cpp >/dev/null 2>&1 || { echo "::error::arm-none-eabi-cpp is missing; install gcc-arm-none-eabi." >&2; exit 1; }
          command -v arm-none-eabi-as >/dev/null 2>&1 || { echo "::error::arm-none-eabi-as is missing; install binutils-arm-none-eabi." >&2; exit 1; }
          command -v arm-none-eabi-ld >/dev/null 2>&1 || { echo "::error::arm-none-eabi-ld is missing; install binutils-arm-none-eabi." >&2; exit 1; }
          command -v arm-none-eabi-objcopy >/dev/null 2>&1 || { echo "::error::arm-none-eabi-objcopy is missing; install binutils-arm-none-eabi." >&2; exit 1; }

      - name: Install pinned archival agbcc compilers
        run: |
          set -euo pipefail

          rm -rf .deps/agbcc-ci "$RUNNER_TEMP/mgfembp-agbcc-ci"
          git init --quiet .deps/agbcc-ci
          git -C .deps/agbcc-ci remote add origin https://github.com/pret/agbcc.git
          git -C .deps/agbcc-ci fetch --quiet --depth=1 origin "$AGBCC_COMMIT"
          git -C .deps/agbcc-ci checkout --quiet --detach FETCH_HEAD
          test "$(git -C .deps/agbcc-ci rev-parse HEAD)" = "$AGBCC_COMMIT"
          (
            cd .deps/agbcc-ci
            ./build.sh
            ./install.sh "$GITHUB_WORKSPACE"
          )

          git init --quiet "$RUNNER_TEMP/mgfembp-agbcc-ci"
          git -C "$RUNNER_TEMP/mgfembp-agbcc-ci" remote add origin https://github.com/StanHash/agbcc.git
          git -C "$RUNNER_TEMP/mgfembp-agbcc-ci" fetch --quiet --depth=1 origin "$MGFEMBP_AGBCC_COMMIT"
          git -C "$RUNNER_TEMP/mgfembp-agbcc-ci" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mgfembp-agbcc-ci" rev-parse HEAD)" = "$MGFEMBP_AGBCC_COMMIT"
          (
            cd "$RUNNER_TEMP/mgfembp-agbcc-ci"
            ./build.sh
            ./install.sh "$GITHUB_WORKSPACE/mgfembp"
          )

      - name: Build tools
        run: ./build_tools.sh

      - name: Build archival lane without a copyrighted baserom
        run: |
          set -euo pipefail
          test ! -e baserom.gba
          make legacy -j2
          test ! -e baserom.gba

      - name: Validate pinned archival payload identities
        run: make -C mgfembp compare

  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Keep the fail-closed aggregate after a master-lane failure, but never
    # execute a Matrix job for any other ref.
    if: ${{ always() && github.ref == 'refs/heads/master' }}
    needs: [host, modern, legacy]
    env:
      HOST_RESULT: ${{ needs.host.result }}
      MODERN_RESULT: ${{ needs.modern.result }}
      LEGACY_RESULT: ${{ needs.legacy.result }}

    steps:
      - name: Render fail-closed matrix summary
        run: |
          {
            echo "## Full Matrix CI"
            echo
            echo "| Item | Conclusion |"
            echo "| --- | --- |"
            echo "| host | $HOST_RESULT |"
            echo "| modern (debug + release) | $MODERN_RESULT |"
            echo "| legacy | $LEGACY_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "$HOST_RESULT" "$MODERN_RESULT" "$LEGACY_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "required Full Matrix CI lane did not succeed: $result" >&2
              exit 1
            fi
          done
