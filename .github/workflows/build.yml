    - name: Validate pinned archival payload identities
      run: make -C mgfembp compare

  # This separate job is the sole publisher. Its event guard excludes pull
  # requests before secrets are materialized; it consumes BASEROM_URL only
  # through curl's environment expansion and never prints or persists it. A
  # fresh hosted runner builds the exact pushed tree before materializing the
  # secret, then destroys every candidate process and state boundary before
  # the private base can exist.
  patch-release:
    needs: [event-identity]
    if: ${{ always() && needs.event-identity.result == 'success' && github.event_name == 'push' && needs.event-identity.outputs.fallback_kind == 'push' && needs.event-identity.outputs.fallback_sha == github.event.after && needs.event-identity.outputs.fallback_sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PATCH_COMMIT: ${{ needs.event-identity.outputs.fallback_sha }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.event-identity.outputs.fallback_sha }}
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Verify exact candidate and stage trusted producer
      env:
        BASH_ENV: ''
        CDPATH: ''
        ENV: ''
        GLOBIGNORE: ''
        GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
        GIT_CEILING_DIRECTORIES: ''
        GIT_COMMON_DIR: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_KEY_0: ''
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_PARAMETERS: ''
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_VALUE_0: ''
        GIT_DIR: ''
        GIT_EXEC_PATH: ''
        GIT_INDEX_FILE: ''
        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_OBJECT_DIRECTORY: ''
        GIT_REPLACE_REF_BASE: ''
        GIT_WORK_TREE: ''
        HOME: ${{ runner.temp }}/patch-runtime
        LD_LIBRARY_PATH: ''
        LD_PRELOAD: ''
        PATH: /usr/bin:/bin
        PATCH_RUNTIME_ROOT: ${{ runner.temp }}/patch-runtime
        PATCH_TOOL_ROOT: ${{ runner.temp }}/patch-tool
        PYTHONPATH: ''
        SHELLOPTS: ''
      run: |
        set -euo pipefail
        unset GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CEILING_DIRECTORIES \
          GIT_COMMON_DIR GIT_DIR GIT_EXEC_PATH GIT_INDEX_FILE GIT_NAMESPACE \
          GIT_OBJECT_DIRECTORY GIT_REPLACE_REF_BASE GIT_WORK_TREE
        ACTUAL_SHA="$(/usr/bin/git rev-parse HEAD)"
        printf 'patch.producer.sha=%s\n' "$ACTUAL_SHA"
        [[ "$PATCH_COMMIT" =~ ^[0-9a-f]{40}$ ]]
        test "$PATCH_COMMIT" != 0000000000000000000000000000000000000000
        test "$ACTUAL_SHA" = "$PATCH_COMMIT"
        test "$(/usr/bin/git rev-parse --verify "$PATCH_COMMIT^{commit}")" = \
          "$PATCH_COMMIT"
        test "$(/usr/bin/git cat-file -t "$PATCH_COMMIT")" = commit
        /bin/rm -rf -- "$PATCH_RUNTIME_ROOT" "$PATCH_TOOL_ROOT" > /dev/null 2>&1
        /usr/bin/install -d -m 0700 "$PATCH_RUNTIME_ROOT" \
          "$PATCH_TOOL_ROOT" "$PATCH_TOOL_ROOT/scripts" \
          "$PATCH_TOOL_ROOT/scripts/modernize"
        for source in scripts/modernize/patch_release.py \
          scripts/modernize/bps_patch.py \
          scripts/modernize/verify_rom_header.py
        do
          test -f "$source"
          test ! -L "$source"
          test "$(/usr/bin/stat -c %F "$source")" = "regular file"
          test "$(/usr/bin/stat -c %h "$source")" = 1
          /usr/bin/install -m 0444 "$source" \
            "$PATCH_TOOL_ROOT/$source"
        done
        /bin/chmod 0555 "$PATCH_TOOL_ROOT" "$PATCH_TOOL_ROOT/scripts" \
          "$PATCH_TOOL_ROOT/scripts/modernize"

    - name: Install trusted isolated-build dependencies
      shell: /bin/bash --noprofile --norc -euo pipefail {0}
      env:
        BASH_ENV: ''
        CDPATH: ''
        ENV: ''
        GLOBIGNORE: ''
        GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
        GIT_CEILING_DIRECTORIES: ''
        GIT_COMMON_DIR: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_KEY_0: ''
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_PARAMETERS: ''
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_VALUE_0: ''
        GIT_DIR: ''
        GIT_EXEC_PATH: ''
        GIT_INDEX_FILE: ''
        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_OBJECT_DIRECTORY: ''
        GIT_REPLACE_REF_BASE: ''
        GIT_WORK_TREE: ''
        HOME: ${{ runner.temp }}/patch-runtime
        LD_LIBRARY_PATH: ''
        LD_PRELOAD: ''
        PATH: /usr/bin:/bin
        PATCH_RUNTIME_ROOT: ${{ runner.temp }}/patch-runtime
        PATCH_WHEELHOUSE: ${{ runner.temp }}/patch-wheelhouse
        PYTHONPATH: ''
        SHELLOPTS: ''
      run: |
        /usr/bin/sudo /usr/bin/apt-get update
        /usr/bin/sudo /usr/bin/apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libmgba-dev libnewlib-arm-none-eabi libpng-dev pkg-config python3-venv
        /bin/rm -rf -- "$PATCH_WHEELHOUSE" > /dev/null 2>&1
        /usr/bin/install -d -m 0700 "$PATCH_WHEELHOUSE"
        /usr/bin/env -i HOME="$PATCH_RUNTIME_ROOT" LC_ALL=C PATH=/usr/bin:/bin PIP_CONFIG_FILE=/dev/null /usr/bin/python3 -I -m pip download --require-hashes --only-binary=:all: --no-deps -r .github/requirements/build.txt --dest "$PATCH_WHEELHOUSE"

    - name: Build candidate in isolated namespace and stage public inputs
      shell: /bin/bash --noprofile --norc -euo pipefail {0}
      env:
        BASH_ENV: ''
        CDPATH: ''
        ENV: ''
        GLOBIGNORE: ''
        GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
        GIT_CEILING_DIRECTORIES: ''
        GIT_COMMON_DIR: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_KEY_0: ''
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_PARAMETERS: ''
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_VALUE_0: ''
        GIT_DIR: ''
        GIT_EXEC_PATH: ''
        GIT_INDEX_FILE: ''
        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_OBJECT_DIRECTORY: ''
        GIT_REPLACE_REF_BASE: ''
        GIT_WORK_TREE: ''
        HOME: ${{ runner.temp }}/patch-runtime
        LD_LIBRARY_PATH: ''
        LD_PRELOAD: ''
        PATH: /usr/bin:/bin
        BUILDER_ROOT: ${{ runner.temp }}/patch-builder
        GITHUB_WORKSPACE_PATH: ${{ github.workspace }}
        PATCH_INPUT_ROOT: ${{ runner.temp }}/patch-input
        PATCH_RUNTIME_ROOT: ${{ runner.temp }}/patch-runtime
        PATCH_WHEELHOUSE: ${{ runner.temp }}/patch-wheelhouse
        PYTHONPATH: ''
        SHELLOPTS: ''
      run: |
        builder_user=ci-patch-builder
        builder_uid=""
        builder_gid=""
        builder_cgroup=""
        builder_cgroup_owned=0
        builder_session_authenticated=0
        builder_session_id=""
        builder_supervisor_parent_pid="$$"
        builder_supervisor_pid=""
        builder_supervisor_starttime=""
        builder_supervisor_state=""
        builder_supervisor_wait_pid=""
        builder_passwd_probe_state=""
        builder_root_owned=0
        builder_uid_occupancy_state=""
        builder_user_created=0
        wheelhouse_owned=0
        shell_pgid="$(/usr/bin/ps -o pgid= -p "$$" 2>/dev/null \
          | /usr/bin/tr -d ' ' 2>/dev/null)"
        builder_passwd_entry_exists() {
          /usr/bin/getent passwd "$1" > /dev/null 2>&1
        }
        probe_builder_passwd_entry() {
          local status
          if builder_passwd_entry_exists "$1"; then
            builder_passwd_probe_state=present
            return 0
          else
            status="$?"
            case "$status" in
              2)
                builder_passwd_probe_state=absent
                return 0
                ;;
              *)
                builder_passwd_probe_state=error
                return "$status"
                ;;
            esac
          fi
        }
        builder_passwd_entry_absent() {
          probe_builder_passwd_entry "$1" || return "$?"
          test "$builder_passwd_probe_state" = absent
        }
        builder_group_pids() {
          local output
          output="$(
            /usr/bin/ps -eo pgid=,pid= 2>/dev/null \
              | /usr/bin/awk -v pgid="$1" '$1 == pgid {print $2}' 2>/dev/null
          )" || return 1
          printf '%s' "$output"
        }
        builder_uid_pids() {
          local output
          output="$(
            /usr/bin/ps -eo uid=,pid= 2>/dev/null \
              | /usr/bin/awk -v uid="$1" '$1 == uid {print $2}' 2>/dev/null
          )" || return 1
          printf '%s' "$output"
        }
        builder_cgroup_pids() {
          local output
          if [ "$builder_cgroup_owned" = 1 ] && \
             [ -r "$builder_cgroup/cgroup.procs" ]; then
            output="$(/bin/cat "$builder_cgroup/cgroup.procs" 2>/dev/null)" \
              || return 1
            printf '%s' "$output"
          fi
        }
        builder_group_is_empty() {
          local output
          output="$(builder_group_pids "$1")" || return 1
          test -z "$output"
        }
        read_builder_identity() {
          local process_identity
          local process_pgid
          local process_sid
          local process_stat
          local stat_record
          local stat_tail
          process_identity="$(
            /usr/bin/ps -o sid=,pgid=,stat= -p "$1" 2>/dev/null \
              | /usr/bin/awk 'NF == 3 {print $1 " " $2 " " $3}' \
                  2>/dev/null
          )" || return 1
          [[ "$process_identity" =~ ^([1-9][0-9]*)[[:space:]]+([1-9][0-9]*)[[:space:]]+([^[:space:]]+)$ ]] \
            || return 1
          process_sid="${BASH_REMATCH[1]}"
          process_pgid="${BASH_REMATCH[2]}"
          process_stat="${BASH_REMATCH[3]}"
          stat_record="$(/bin/cat "/proc/$1/stat" 2>/dev/null)" || return 1
          case "$stat_record" in
            *") "*) ;;
            *) return 1 ;;
          esac
          stat_tail="${stat_record##*) }"
          set -- $stat_tail
          test "$#" -ge 20 || return 1
          test "$2" = "$builder_supervisor_parent_pid" || return 1
          test "$3" = "$process_pgid" || return 1
          test "$4" = "$process_sid" || return 1
          test "${process_stat:0:1}" = "$1" || return 1
          [[ "${20}" =~ ^[1-9][0-9]*$ ]] || return 1
          printf '%s %s %s %s %s' \
            "$2" "$4" "$3" "$process_stat" "${20}"
        }
        builder_supervisor_identity_matches() {
          local expected_state="$1"
          local identity
          test "$builder_session_authenticated" = 1 || return 1
          [[ "$builder_session_id" =~ ^[1-9][0-9]*$ ]] || return 1
          test "$builder_session_id" != "$shell_pgid" || return 1
          test -n "$builder_supervisor_pid" || return 1
          test "$builder_session_id" = "$builder_supervisor_pid" || return 1
          test "$builder_supervisor_wait_pid" = "$builder_supervisor_pid" \
            || return 1
          identity="$(read_builder_identity "$builder_supervisor_pid")" \
            || return 1
          [[ "$identity" =~ ^([1-9][0-9]*)[[:space:]]+([1-9][0-9]*)[[:space:]]+([1-9][0-9]*)[[:space:]]+([^[:space:]]+)[[:space:]]+([1-9][0-9]*)$ ]] \
            || return 1
          test "${BASH_REMATCH[1]}" = "$builder_supervisor_parent_pid" \
            || return 1
          test "${BASH_REMATCH[2]}" = "$builder_session_id" || return 1
          test "${BASH_REMATCH[3]}" = "$builder_session_id" || return 1
          test "${BASH_REMATCH[5]}" = "$builder_supervisor_starttime" \
            || return 1
          case "$expected_state" in
            stopped) [[ "${BASH_REMATCH[4]}" = T* ]] ;;
            starting) [[ "${BASH_REMATCH[4]}" != Z* ]] ;;
            running) [[ "${BASH_REMATCH[4]}" != T* && "${BASH_REMATCH[4]}" != Z* ]] ;;
            zombie) [[ "${BASH_REMATCH[4]}" = Z* ]] ;;
            owned) true ;;
            *) return 1 ;;
          esac
        }
        probe_builder_uid_occupancy() {
          local output
          local status
          if output="$(builder_uid_pids "$1")"; then
            if [ -z "$output" ]; then
              builder_uid_occupancy_state=free
            else
              builder_uid_occupancy_state=occupied
            fi
            return 0
          else
            status="$?"
          fi
          builder_uid_occupancy_state=error
          return "$status"
        }
        builder_uid_is_empty() {
          probe_builder_uid_occupancy "$1" || return "$?"
          test "$builder_uid_occupancy_state" = free
        }
        builder_cgroup_is_empty() {
          local output
          output="$(builder_cgroup_pids)" || return 1
          test -z "$output"
        }
        terminate_builder_processes() {
          cleanup_failed=0
          supervisor_authenticated=0
          if [ -n "$builder_session_id" ] && \
             [ -n "$builder_supervisor_pid" ]; then
            if builder_supervisor_identity_matches zombie; then
              supervisor_authenticated=1
            elif builder_supervisor_identity_matches \
              "$builder_supervisor_state"
            then
              supervisor_authenticated=1
              remaining_group=""
              remaining_group="$(builder_group_pids "$builder_session_id")" \
                || cleanup_failed=1
              if [ -n "$remaining_group" ] && \
                 builder_supervisor_identity_matches \
                   "$builder_supervisor_state"
              then
                /usr/bin/sudo /bin/kill -TERM -- "-$builder_session_id" \
                  > /dev/null 2>&1 || true
                /bin/sleep 1
              fi
              if builder_supervisor_identity_matches zombie; then
                :
              elif builder_supervisor_identity_matches owned; then
                /usr/bin/sudo /bin/kill -KILL -- "-$builder_session_id" \
                  > /dev/null 2>&1 || true
                /bin/sleep 0.1
              fi
            else
              cleanup_failed=1
            fi
          fi
          if [ "$builder_cgroup_owned" = 1 ]; then
            if ! builder_cgroup_is_empty; then
              printf '1\n' \
                | /usr/bin/sudo /usr/bin/tee \
                  "$builder_cgroup/cgroup.kill" > /dev/null 2>&1
              for attempt in $(/usr/bin/seq 1 50); do
                if builder_cgroup_is_empty; then
                  break
                fi
                /bin/sleep 0.1
              done
            fi
            builder_cgroup_is_empty || cleanup_failed=1
          fi
          if [ "$supervisor_authenticated" = 1 ] && \
             [ -n "$builder_supervisor_pid" ]; then
            supervisor_reap_ready=0
            for attempt in $(/usr/bin/seq 1 50); do
              if builder_supervisor_identity_matches zombie; then
                supervisor_reap_ready=1
                break
              fi
              if [ ! -e "/proc/$builder_supervisor_pid" ]; then
                supervisor_reap_ready=1
                break
              fi
              if ! builder_supervisor_identity_matches owned; then
                cleanup_failed=1
                break
              fi
              /bin/sleep 0.1
            done
            if [ "$supervisor_reap_ready" = 1 ] && \
               [ "$builder_supervisor_wait_pid" = "$builder_supervisor_pid" ]
            then
              wait "$builder_supervisor_wait_pid" > /dev/null 2>&1 || true
              builder_supervisor_pid=""
              builder_supervisor_wait_pid=""
            else
              cleanup_failed=1
            fi
          fi
          if [ -n "$builder_session_id" ]; then
            builder_group_is_empty "$builder_session_id" || cleanup_failed=1
          fi
          builder_uid_is_empty "$builder_uid" || cleanup_failed=1
          return "$cleanup_failed"
        }
        remove_builder_cgroup() {
          cleanup_failed=0
          if [ "$builder_cgroup_owned" = 1 ]; then
            builder_cgroup_is_empty || cleanup_failed=1
            if [ "$cleanup_failed" = 0 ] && \
               /usr/bin/sudo /usr/bin/rmdir -- "$builder_cgroup" \
                 > /dev/null 2>&1; then
              builder_cgroup_owned=0
            else
              cleanup_failed=1
            fi
          fi
          test ! -e "$builder_cgroup" || cleanup_failed=1
          return "$cleanup_failed"
        }
        remove_builder_state() {
          cleanup_failed=0
          if [ "$builder_user_created" = 1 ]; then
            if builder_passwd_entry_exists "$builder_user"; then
              if /usr/bin/sudo /usr/sbin/userdel "$builder_user" \
                > /dev/null 2>&1; then
                builder_user_created=0
              else
                cleanup_failed=1
              fi
            else
              builder_user_created=0
            fi
          fi
          if [ "$builder_root_owned" = 1 ]; then
            if /usr/bin/sudo /bin/rm -rf -- "$BUILDER_ROOT" \
              > /dev/null 2>&1; then
              builder_root_owned=0
            else
              cleanup_failed=1
            fi
          fi
          if [ "$wheelhouse_owned" = 1 ]; then
            if /bin/rm -rf -- "$PATCH_WHEELHOUSE" > /dev/null 2>&1; then
              wheelhouse_owned=0
            else
              cleanup_failed=1
            fi
          fi
          builder_passwd_entry_absent "$builder_user" || cleanup_failed=1
          test ! -e "$BUILDER_ROOT" || cleanup_failed=1
          test ! -e "$PATCH_WHEELHOUSE" || cleanup_failed=1
          return "$cleanup_failed"
        }
        cleanup_builder() {
          status="$?"
          trap - EXIT INT TERM
          set +e
          terminate_builder_processes
          process_cleanup="$?"
          remove_builder_cgroup
          cgroup_cleanup="$?"
          remove_builder_state
          state_cleanup="$?"
          if [ "$process_cleanup" -ne 0 ] || \
             [ "$cgroup_cleanup" -ne 0 ] || \
             [ "$state_cleanup" -ne 0 ]; then
            printf 'candidate build cleanup failed: process=%d cgroup=%d state=%d primary=%d\n' \
              "$process_cleanup" "$cgroup_cleanup" "$state_cleanup" \
              "$status" >&2
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if [ "$process_cleanup" -ne 0 ] || \
             [ "$cgroup_cleanup" -ne 0 ] || \
             [ "$state_cleanup" -ne 0 ]; then
            exit 1
          fi
          exit 0
        }
        trap cleanup_builder EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        test ! -e "$BUILDER_ROOT"
        test -d "$PATCH_WHEELHOUSE"
        test ! -L "$PATCH_WHEELHOUSE"
        wheelhouse_owned=1
        builder_passwd_entry_absent "$builder_user"
        /usr/bin/install -d -m 0700 "$BUILDER_ROOT"
        builder_root_owned=1
        /usr/bin/install -d -m 0700 \
          "$BUILDER_ROOT/control" "$BUILDER_ROOT/handoff" \
          "$BUILDER_ROOT/source" "$BUILDER_ROOT/wheelhouse"
        /bin/cp -a -- "$GITHUB_WORKSPACE_PATH/." "$BUILDER_ROOT/source/"
        /bin/cp -a -- "$PATCH_WHEELHOUSE/." "$BUILDER_ROOT/wheelhouse/"
        builder_uid=60000
        while [ "$builder_uid" -ge 50000 ]; do
          probe_builder_passwd_entry "$builder_uid"
          if [ "$builder_passwd_probe_state" = absent ]; then
            probe_builder_uid_occupancy "$builder_uid"
            if [ "$builder_uid_occupancy_state" = free ]; then
              break
            fi
          fi
          builder_uid="$((builder_uid - 1))"
        done
        test "$builder_uid" -ge 50000
        /usr/bin/sudo /usr/sbin/useradd --no-create-home --no-user-group \
          --gid nogroup --uid "$builder_uid" \
          --home-dir "$BUILDER_ROOT/home" --shell /usr/sbin/nologin \
          "$builder_user"
        builder_user_created=1
        test "$(/usr/bin/id -u "$builder_user")" = "$builder_uid"
        builder_gid="$(/usr/bin/id -g "$builder_user")"
        builder_uid_is_empty "$builder_uid"
        /usr/bin/tee "$BUILDER_ROOT/control/builder-isolation.sh" \
          > /dev/null <<'BUILDER_ISOLATION'
        #!/bin/bash
        builder_main() {
        set -euo pipefail
        cgroup_path="$1"
        builder_uid="$2"
        builder_gid="$3"
        builder_root="$4"
        host_runner_temp="$5"
        candidate_script="$6"
        candidate_launcher="$7"
        host_uid="$8"
        host_gid="$9"
        exec < /dev/null > /dev/null 2>&1
        printf '%s\n' "$$" > "$cgroup_path/cgroup.procs"
        /usr/bin/grep -Fqx "$$" "$cgroup_path/cgroup.procs"
        cd /
        /usr/bin/mount --make-rprivate /
        /usr/bin/mount --bind / /
        /usr/bin/mount -o remount,bind,ro /
        case "$host_runner_temp" in
          /home/runner/*) ;;
          *) echo "runner temp is outside the masked host tree" >&2; exit 1 ;;
        esac
        /usr/bin/mount -t tmpfs \
          -o nosuid,nodev,noexec,mode=0755,size=16m \
          builder-work /mnt
        /usr/bin/mkdir -m 0755 /mnt/control /mnt/export /mnt/handoff \
          /mnt/home /mnt/source /mnt/tmp /mnt/wheelhouse
        /usr/bin/mkdir -m 0700 /mnt/supervisor
        /usr/bin/mount -t tmpfs \
          -o nosuid,nodev,noexec,mode=0700,size=1m \
          builder-supervisor /mnt/supervisor
        /usr/bin/mkdir -m 0700 /mnt/supervisor/cgroup
        test "$(/usr/bin/stat -c %u /mnt/supervisor)" = 0
        test "$(/usr/bin/stat -c %a /mnt/supervisor)" = 700
        test "$(/usr/bin/stat -c %u "$cgroup_path")" = 0
        /usr/bin/mount --bind "$cgroup_path" /mnt/supervisor/cgroup
        /usr/bin/mount -o remount,bind,ro,nosuid,nodev,noexec \
          /mnt/supervisor/cgroup
        supervisor_cgroup=/mnt/supervisor/cgroup
        test "$(/usr/bin/stat -Lc %d:%i "$cgroup_path/cgroup.procs")" = \
          "$(/usr/bin/stat -Lc %d:%i "$supervisor_cgroup/cgroup.procs")"
        supervisor_options="$(/usr/bin/findmnt -n -o OPTIONS \
          --target "$supervisor_cgroup")"
        for option in ro nosuid nodev noexec; do
          case ",$supervisor_options," in
            *,"$option",*) ;;
            *) exit 125 ;;
          esac
        done
        /usr/bin/mount -t tmpfs \
          -o nosuid,nodev,mode=0755,size=6g builder-source /mnt/source
        /bin/cp -a -- "$builder_root/source/." /mnt/source/
        /usr/bin/mount -t tmpfs \
          -o nosuid,nodev,mode=0700,size=1g builder-home /mnt/home
        /usr/bin/mount -t tmpfs \
          -o nosuid,nodev,mode=0700,size=1g builder-temp /mnt/tmp
        /usr/bin/mount -t tmpfs \
          -o nosuid,nodev,noexec,mode=0700,size=40m \
          builder-handoff /mnt/handoff
        /usr/bin/mount --bind "$builder_root/handoff" /mnt/export
        /usr/bin/mount -o remount,bind,ro,nosuid,nodev,noexec /mnt/export
        /usr/bin/mount --bind "$builder_root/wheelhouse" /mnt/wheelhouse
        /usr/bin/mount -o remount,bind,ro,nosuid,nodev,noexec \
          /mnt/wheelhouse
        /usr/bin/install -m 0555 "$candidate_script" \
          /mnt/control/candidate-build.sh
        /usr/bin/install -m 0444 "$candidate_launcher" \
          /mnt/control/candidate-launcher.py
        /usr/bin/chown -R "$builder_uid:$builder_gid" \
          /mnt/handoff /mnt/home /mnt/source /mnt/tmp
        /usr/bin/mount --bind /mnt/control /mnt/control
        /usr/bin/mount -o remount,bind,ro,nosuid,nodev,noexec /mnt/control
        /usr/bin/mount -o remount,ro,nosuid,nodev,noexec /mnt
        unmount_if_mounted() {
