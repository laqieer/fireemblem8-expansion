        import decimal
        import json
        import math
        import os
        import re
        import stat
        import sys

        MAX_EVENT_PATH_BYTES = 4096
        MAX_EVENT_REF_BYTES = 128
        MAX_NUMBER_BYTES = 20
        MAX_REF_BYTES = 1024
        MAX_EVENT_BYTES = 1048576
        MAX_EVENT_READ_BYTES = MAX_EVENT_BYTES + 1
        MAX_FLOAT_LITERAL_BYTES = 128
        MAX_TITLE_BYTES = 65536
        MAX_BODY_BYTES = MAX_EVENT_BYTES
        SHA_RE = re.compile(r"^[0-9a-f]{40}$")
        NUMBER_RE = re.compile(r"^[1-9][0-9]{0,18}$")
        ALLOWED_CHANGE_KEYS = (
            frozenset({"body"}),
            frozenset({"title"}),
            frozenset({"body", "title"}),
        )
        EVENT_FILE_FLAGS = (
            os.O_RDONLY
            | getattr(os, "O_CLOEXEC", 0)
            | getattr(os, "O_NOFOLLOW", 0)
            | getattr(os, "O_NONBLOCK", 0)
        )

        def fail(message):
            print(message, file=sys.stderr)
            raise SystemExit(1)

        def utf8_len(value):
            return len(value.encode("utf-8"))

        def env(name, *, max_bytes):
            value = os.environ.get(name)
            if value is None or value == "":
                fail(f"metadata-only raw event missing {name}")
            if utf8_len(value) > max_bytes:
                fail(f"metadata-only raw event {name} exceeds bounds")
            return value

        def reject_duplicates(pairs):
            result = {}
            for key, value in pairs:
                if key in result:
                    fail("metadata-only raw event JSON repeats a key")
                result[key] = value
            return result

        def reject_nonfinite_constant(value):
            fail(f"metadata-only raw event JSON contains non-finite number {value}")

        def parse_strict_float(value):
            if len(value) > MAX_FLOAT_LITERAL_BYTES:
                fail("metadata-only raw event JSON float literal is too long")
            try:
                decimal_value = decimal.Decimal(value)
                float_value = float(decimal_value)
            except (decimal.InvalidOperation, OverflowError, ValueError):
                fail(f"metadata-only raw event JSON float is invalid: {value}")
            if not math.isfinite(float_value):
                fail(f"metadata-only raw event JSON float overflows: {value}")
            if decimal_value != 0 and float_value == 0:
                fail(f"metadata-only raw event JSON float underflows: {value}")
            return float_value

        def ensure_finite_numbers(value):
            if isinstance(value, float):
                if not math.isfinite(value):
                    fail("metadata-only raw event JSON contains non-finite float")
                return
            if isinstance(value, dict):
                for item in value.values():
                    ensure_finite_numbers(item)
                return
            if isinstance(value, list):
                for item in value:
                    ensure_finite_numbers(item)

        def parse_required_text(value, *, field, max_bytes):
            if not isinstance(value, str) or value == "":
                fail(f"metadata-only raw event {field} is invalid")
            if utf8_len(value) > max_bytes:
                fail(f"metadata-only raw event {field} exceeds bounds")
            return value

        def parse_title_text(value, *, field, max_bytes):
            text = parse_required_text(value, field=field, max_bytes=max_bytes)
            if not text.strip():
                fail(f"metadata-only raw event {field} is invalid")
            return text

        def is_git_branch_ref(value):
            if not isinstance(value, str) or not value or value == "@":
                return False
            try:
                if utf8_len(value) > MAX_REF_BYTES:
                    return False
            except UnicodeEncodeError:
                return False
            if (
                value.startswith("/")
                or value.endswith("/")
                or value.endswith(".")
                or "//" in value
                or ".." in value
                or "@{" in value
            ):
                return False
            if any(
                ord(character) < 0x20
                or ord(character) == 0x7F
                or character in " ~^:?*[\\"
                for character in value
            ):
                return False
            return all(
                component
                and not component.startswith(".")
                and not component.endswith(".lock")
                for component in value.split("/")
            )

        def parse_sha(value, *, field):
            if not isinstance(value, str) or SHA_RE.fullmatch(value) is None:
                fail(f"metadata-only raw event {field} is invalid")
            return value

        def file_signature(metadata):
            return (
                metadata.st_dev,
                metadata.st_ino,
                metadata.st_mode,
                metadata.st_uid,
                metadata.st_size,
                getattr(metadata, "st_mtime_ns", 0),
                getattr(metadata, "st_ctime_ns", 0),
            )

        def load_event_payload():
            event_path = env("GITHUB_EVENT_PATH", max_bytes=MAX_EVENT_PATH_BYTES)
            try:
                metadata = os.lstat(event_path)
            except OSError as error:
                fail(f"metadata-only raw event cannot inspect payload: {error}")
            if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):
                fail("metadata-only raw event payload must be a regular file")
            if metadata.st_uid != os.getuid():
                fail("metadata-only raw event payload owner is invalid")
            if metadata.st_size > MAX_EVENT_BYTES:
                fail("metadata-only raw event payload exceeds 1 MiB")
            try:
                fd = os.open(event_path, EVENT_FILE_FLAGS)
            except OSError as error:
                fail(f"metadata-only raw event cannot open payload: {error}")
            try:
                opened = os.fstat(fd)
                if not stat.S_ISREG(opened.st_mode):
                    fail("metadata-only raw event payload must be a regular file")
                if opened.st_uid != metadata.st_uid or opened.st_uid != os.getuid():
                    fail("metadata-only raw event payload owner is invalid")
                if file_signature(opened) != file_signature(metadata):
                    fail("metadata-only raw event payload changed before read")
                raw = bytearray()
                while len(raw) < MAX_EVENT_READ_BYTES:
                    chunk = os.read(fd, min(65536, MAX_EVENT_READ_BYTES - len(raw)))
                    if not chunk:
                        break
                    raw.extend(chunk)
                final = os.fstat(fd)
            except OSError as error:
                fail(f"metadata-only raw event cannot read payload: {error}")
            finally:
                os.close(fd)
            if len(raw) > MAX_EVENT_BYTES:
                fail("metadata-only raw event payload exceeds 1 MiB")
            if file_signature(final) != file_signature(opened) or len(raw) != opened.st_size:
                fail("metadata-only raw event payload changed while being read")
            try:
                payload = json.loads(
                    raw.decode("utf-8"),
                    object_pairs_hook=reject_duplicates,
                    parse_constant=reject_nonfinite_constant,
                    parse_float=parse_strict_float,
                )
            except (UnicodeDecodeError, json.JSONDecodeError) as error:
                fail(f"metadata-only raw event payload is not valid JSON: {error}")
            if not isinstance(payload, dict):
                fail("metadata-only raw event payload must be an object")
            ensure_finite_numbers(payload)
            return payload

        def parse_nullable_text(value, *, field, max_bytes):
            if value is None:
                return None
            if not isinstance(value, str):
                fail(f"metadata-only raw event {field} must be a string or null")
            if utf8_len(value) > max_bytes:
                fail(f"metadata-only raw event {field} exceeds bounds")
            return value

        payload = load_event_payload()

        event_name = env("GITHUB_EVENT_NAME", max_bytes=32)
        if event_name != "pull_request":
            fail("metadata-only raw event is not an edited pull_request")
        event_action = payload.get("action")
        if event_action != "edited":
            fail("metadata-only raw event is not an edited pull_request")

        pr_number = payload.get("number")
        if (
            isinstance(pr_number, bool)
            or not isinstance(pr_number, int)
            or pr_number < 1
            or utf8_len(str(pr_number)) > MAX_NUMBER_BYTES
            or NUMBER_RE.fullmatch(str(pr_number)) is None
        ):
            fail("metadata-only raw event PR number is invalid")

        event_ref = env("GITHUB_REF", max_bytes=MAX_EVENT_REF_BYTES)
        if event_ref != f"refs/pull/{pr_number}/merge":
            fail("metadata-only raw event ref is invalid")

        pull_request = payload.get("pull_request")
        if not isinstance(pull_request, dict):
            fail("metadata-only raw event pull_request is invalid")

        base = pull_request.get("base")
        if not isinstance(base, dict):
            fail("metadata-only raw event base ref is invalid")
        base_ref = base.get("ref")
        if not is_git_branch_ref(base_ref):
            fail("metadata-only raw event base ref is invalid")

        base_sha = parse_sha(base.get("sha"), field="base sha")

        head = pull_request.get("head")
        if not isinstance(head, dict):
            fail("metadata-only raw event head sha is invalid")
        head_sha = parse_sha(head.get("sha"), field="head sha")

        classified_base = env("CLASSIFIED_BASE_SHA", max_bytes=64)
        classified_head = env("CLASSIFIED_BUILD_SHA", max_bytes=64)
        fallback_sha = env("FALLBACK_SHA", max_bytes=64)
        if (
            SHA_RE.fullmatch(classified_base) is None
            or SHA_RE.fullmatch(classified_head) is None
            or SHA_RE.fullmatch(fallback_sha) is None
            or classified_head != env("EXPECTED_BUILD_SHA", max_bytes=64)
            or classified_base != base_sha
            or classified_head != head_sha
            or fallback_sha != head_sha
        ):
            fail("metadata-only raw event does not match classifier identity")

        changes = payload.get("changes")
        if not isinstance(changes, dict):
            fail("metadata-only raw event changes must be an object")
        change_keys = frozenset(changes)
        if change_keys not in ALLOWED_CHANGE_KEYS:
            fail("metadata-only raw event changes must be exactly body/title only")

        def current_changed_value(name):
            field = f"pull_request.{name}"
            if name not in pull_request:
                fail(f"metadata-only raw event {field} is missing")
            value = pull_request[name]
            if name == "title":
                return parse_title_text(
                    value,
                    field=field,
                    max_bytes=MAX_TITLE_BYTES,
                )
            return parse_nullable_text(
                value,
                field=field,
                max_bytes=MAX_BODY_BYTES,
            )

        def validate_change(name):
            change = changes.get(name)
            if not isinstance(change, dict) or set(change) != {"from"}:
                fail(f"metadata-only raw event changes.{name} must contain only from")
            current = current_changed_value(name)
            if name == "title":
                previous = parse_title_text(
                    change["from"],
                    field=f"changes.{name}.from",
                    max_bytes=MAX_TITLE_BYTES,
                )
            else:
                previous = parse_nullable_text(
                    change["from"],
                    field=f"changes.{name}.from",
                    max_bytes=MAX_BODY_BYTES,
                )
            if previous == current:
                fail(f"metadata-only raw event {name} did not change")

        if "body" in changes:
            validate_change("body")
        if "title" in changes:
            validate_change("title")
        PY
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: ${{ needs.event-classifier.result == 'failure' || needs.event-classifier.outputs.classification == 'full' }}
      with:
        ref: ${{ (needs.event-classifier.result == 'success' && needs.event-classifier.outputs.expected_head) || (needs.event-classifier.result == 'failure' && needs.event-identity.outputs.fallback_sha) || '' }}
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Verify checked-out revision
      if: ${{ needs.event-classifier.result == 'failure' || needs.event-classifier.outputs.classification == 'full' }}
      run: |
        ACTUAL_SHA="$(git rev-parse HEAD)"
        printf 'checkout.sha=%s\n' "$ACTUAL_SHA"
        test "$ACTUAL_SHA" = "$EXPECTED_BUILD_SHA"

    # Runs against the immutable commit CI is building (not the mutable
    # worktree/index) and before Install dependencies/Build tools create any
    # build output, so a prohibited tracked artifact fails fast on Git object
    # content instead of being masked by later build products.
    - name: Check tracked artifacts
      if: ${{ needs.event-classifier.result == 'failure' || needs.event-classifier.outputs.classification == 'full' }}
      run: |
        python3 -m unittest discover -s scripts/artifact_guard_tests -p 'test_*.py' -v
        python3 scripts/artifact_guard.py --revision HEAD

    # Issues #7/#17 closure: a fast, stdlib-only, zero-network,
    # zero-ROM documentation governance gate. Runs the checker's own
    # unittest suite, then the checker itself (100% Markdown-inventory
    # exact-coverage, internal link/anchor resolution, external-link
    # registry coverage, stale-command/path denylist, and statically
    # parsed -- never executed -- Makefile-target existence), plus a
    # small hardcoded allowlist of --help-only example commands. Placed
    # immediately after the artifact guard and before dependency
    # install/tool build/ROM linker gates below, so a documentation
    # regression fails in seconds instead of after a multi-minute build.
    - name: Check documentation (issues #7/#17)
      if: ${{ needs.event-classifier.result == 'failure' || needs.event-classifier.outputs.classification == 'full' }}
      run: |
        python3 -m unittest discover -s scripts/docs_check_tests -v
        python3 scripts/check_docs.py --check --check-examples

    - name: Install dependencies
      if: ${{ needs.event-classifier.result == 'failure' || needs.event-classifier.outputs.classification == 'full' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev pkg-config gcc-arm-none-eabi libnewlib-arm-none-eabi libmgba-dev
        python3 -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/requirements/build.txt

    - name: Build tools
      if: ${{ needs.event-classifier.result == 'failure' || needs.event-classifier.outputs.classification == 'full' }}
      run: ./build_tools.sh

    - name: Run CodeQL alert regression suite (issue #84)
      if: ${{ needs.event-classifier.result == 'failure' || needs.event-classifier.outputs.classification == 'full' }}
      run: make codeql-alerts-test CODEQL_REQUIRE_FANALYZER=1

    # Issue #15 closure: a bare `make`/`make all` must unconditionally
    # resolve to the modern release AAPCS boot-check chain, with the
    # archival agbcc lane reachable only by explicitly naming `make
    # legacy`/`make fireemblem8.gba` -- never via any environment variable
    # or `make` command-line variable override. These targeted tests are
    # stdlib `unittest` only (no pytest/network installs) and are dry-run/
    # database-probe based against the real Makefile/quickstart.sh (never a
    # real multi-minute compile/link/boot-check), so they run early and
    # fail fast on any structural regression before the slower linker gate
    # below.
    - name: Check default build lane and quickstart legacy glue (issue #15)
      if: ${{ needs.event-classifier.result == 'failure' || needs.event-classifier.outputs.classification == 'full' }}
      run: |
        python3 -m unittest discover -s scripts/modernize/tests -p "test_build_default_lane.py" -v
        python3 -m unittest discover -s scripts/modernize/tests -p "test_quickstart.py" -v

    # Generated-data platform (Issue #5 Chapter 2 slice, Batch C): validates
    # every registered table's JSON source, cross-table references, the
    # whole-bundle chapter manifest, and committed inventory drift. Pure
    # Python/stdlib, no generated C is linked here -- runs once, before the
    # target-ROM linker gate below, so a stale/inconsistent data source
    # fails fast with actionable file:line diagnostics instead of being
    # masked by (or confused with) a much slower linker failure.
    - name: Check generated-data tables for drift
      if: ${{ needs.event-classifier.result == 'failure' || needs.event-classifier.outputs.classification == 'full' }}
      run: |
        make generated-data-test
        make generated-data-check

    # The linker gate builds the full modern object/ELF/ROM chain, checks
    # deterministic memory budgets, rejects orphan/overflow/cross-overlay
    # errors, and verifies normal plus shifted boot/title behavior, plus
    # (issue #13) debugtools/new-game/save-format/suspend-resume runtime
    # scenarios and the relocation/raw-pointer/offset audits -- all reusing
    # this same modern object/ELF build for both configs rather than
    # rebuilding per check. This is the default-cap lane; the expanded-cap
    # issue #10 item-ID-expansion gate below is the final target-ROM step.
    - name: Build and verify modern target ROMs and linker
      if: ${{ needs.event-classifier.result == 'failure' || needs.event-classifier.outputs.classification == 'full' }}
