name: Build CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [ "master" ]

permissions:
  actions: read
  contents: read

jobs:
  # Validate raw event identities before any checkout. This job executes only
  # the trusted workflow shell: it never reads or runs candidate-controlled
  # repository content.
  event-identity:
    name: event-identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classifier_available: ${{ steps.identity.outputs.classifier_available }}
      classifier_expected_sha: ${{ steps.identity.outputs.classifier_expected_sha }}
      classifier_ref: ${{ steps.identity.outputs.classifier_ref }}
      fallback_kind: ${{ steps.identity.outputs.fallback_kind }}
      fallback_sha: ${{ steps.identity.outputs.fallback_sha }}
    env:
      BASH_ENV: ''
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ENV: ''
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      PATH: /usr/bin:/bin
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_SHA_JSON: ${{ toJSON(github.event.pull_request.base.sha) }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_SHA_JSON: ${{ toJSON(github.event.pull_request.head.sha) }}
      PR_NUMBER: ${{ github.event.number }}
      PR_NUMBER_JSON: ${{ toJSON(github.event.number) }}
      PUSH_SHA: ${{ github.event.after }}
      PUSH_SHA_JSON: ${{ toJSON(github.event.after) }}
      RAW_SHA: ${{ github.sha }}
      RAW_SHA_JSON: ${{ toJSON(github.sha) }}

    steps:
    - name: Validate trusted event identities
      id: identity
      run: |
        is_lower_sha() {
          [[ "$1" =~ ^[0-9a-f]{40}$ && "$2" = "\"$1\"" ]]
        }
        is_pr_number() {
          [[ "$1" =~ ^[1-9][0-9]*$ && "$2" = "$1" ]]
        }

        classifier_available=false
        classifier_expected_sha=""
        classifier_ref=""
        fallback_kind="none"
        fallback_sha=""

        if [[ "$EVENT_NAME" = "pull_request" ]]; then
          if is_pr_number "$PR_NUMBER" "$PR_NUMBER_JSON" && \
             [[ "$EVENT_REF" = "refs/pull/$PR_NUMBER/merge" ]] && \
             is_lower_sha "$PR_HEAD_SHA" "$PR_HEAD_SHA_JSON"; then
            fallback_kind="pull_request"
            fallback_sha="$PR_HEAD_SHA"
          fi
          if is_lower_sha "$PR_BASE_SHA" "$PR_BASE_SHA_JSON"; then
            classifier_expected_sha="$PR_BASE_SHA"
            classifier_ref="$PR_BASE_SHA"
          elif [[ -n "$DEFAULT_BRANCH" ]]; then
            bootstrap_ref="refs/heads/$DEFAULT_BRANCH"
            if /usr/bin/git check-ref-format "$bootstrap_ref" \
                 > /dev/null 2>&1; then
              classifier_ref="$bootstrap_ref"
            fi
          fi
        elif [[ "$EVENT_NAME" = "push" && "$EVENT_REF" = "refs/heads/master" ]] && \
             is_lower_sha "$PUSH_SHA" "$PUSH_SHA_JSON" && \
             is_lower_sha "$RAW_SHA" "$RAW_SHA_JSON" && \
             [[ "$RAW_SHA" = "$PUSH_SHA" ]]; then
          classifier_expected_sha="$PUSH_SHA"
          classifier_ref="$PUSH_SHA"
          fallback_kind="push"
          fallback_sha="$PUSH_SHA"
        fi
        if [[ -n "$classifier_ref" ]]; then
          classifier_available=true
        fi

        {
          echo "classifier_available=$classifier_available"
          echo "classifier_expected_sha=$classifier_expected_sha"
          echo "classifier_ref=$classifier_ref"
          echo "fallback_kind=$fallback_kind"
          echo "fallback_sha=$fallback_sha"
        } >> "$GITHUB_OUTPUT"

  # Event payloads are classified from the current integration base, never
  # from mutable PR-head code. A branch whose base predates the classifier
  # takes the bootstrap full-build path. Classifier failure with a separately
  # validated event-specific PR head or guarded master-push SHA runs every
  # worker at that exact SHA, then fails summary; without one it runs none.
  # Missing/stale successful output never selects a fallback ref. Unknown,
  # mixed, and incomplete change records with complete identity select the
  # expensive graph.
  event-router:
    name: event-router
    if: ${{ always() && needs.event-identity.result == 'success' }}
    needs: [event-identity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
      expected_base: ${{ steps.classify.outputs.expected_base }}
      expected_head: ${{ steps.classify.outputs.expected_head }}
      full_fallback: ${{ steps.classify.outputs.full_fallback }}
      head_valid: ${{ steps.classify.outputs.head_valid }}
      identity_valid: ${{ steps.classify.outputs.identity_valid }}
      reason: ${{ steps.classify.outputs.reason }}
      run_expensive: ${{ steps.classify.outputs.run_expensive }}
    env:
      CLASSIFIER_AVAILABLE: ${{ needs.event-identity.outputs.classifier_available }}
      CLASSIFIER_EXPECTED_SHA: ${{ needs.event-identity.outputs.classifier_expected_sha }}
      CLASSIFIER_REF: ${{ needs.event-identity.outputs.classifier_ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_BASE_REF_JSON: ${{ toJSON(github.event.pull_request.base.ref) }}
      PR_BASE_SHA_JSON: ${{ toJSON(github.event.pull_request.base.sha) }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PUSH_SHA: ${{ github.event.after }}
      VALIDATED_FALLBACK_KIND: ${{ needs.event-identity.outputs.fallback_kind }}
      VALIDATED_FALLBACK_SHA: ${{ needs.event-identity.outputs.fallback_sha }}

    steps:
    - name: Require classifier authority
      if: ${{ needs.event-identity.outputs.classifier_available != 'true' }}
      run: |
        echo "Build classifier authority is unavailable" >&2
        exit 1

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: ${{ needs.event-identity.outputs.classifier_available == 'true' }}
      with:
        ref: ${{ needs.event-identity.outputs.classifier_ref }}
        fetch-depth: 1
        persist-credentials: false

    - name: Verify classifier authority revision
      if: ${{ needs.event-identity.outputs.classifier_available == 'true' }}
      run: |
        ACTUAL_SHA="$(git rev-parse HEAD)"
        printf 'classifier.sha=%s\n' "$ACTUAL_SHA"
        if [ -n "$CLASSIFIER_EXPECTED_SHA" ]; then
          test "$ACTUAL_SHA" = "$CLASSIFIER_EXPECTED_SHA"
        else
          test "$CLASSIFIER_REF" = "refs/heads/$DEFAULT_BRANCH"
        fi

    - name: Classify Build event
      id: classify
      if: ${{ needs.event-identity.outputs.classifier_available == 'true' }}
      env:
        BASH_ENV: ''
        ENV: ''
        GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
        GIT_CEILING_DIRECTORIES: ''
        GIT_COMMON_DIR: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_KEY_0: ''
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_PARAMETERS: ''
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_VALUE_0: ''
        GIT_DIR: ''
        GIT_EXEC_PATH: ''
        GIT_INDEX_FILE: ''
        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_OBJECT_DIRECTORY: ''
        GIT_REPLACE_REF_BASE: ''
        GIT_WORK_TREE: ''
        PATH: /usr/bin:/bin
        PYTHONPATH: ''
      run: |
        if test -f scripts/workflow_pilot/event_classifier.py; then
          /usr/bin/python3 -I scripts/workflow_pilot/isolated_launcher.py classify-event \
            --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" \
            --github-ref "$GITHUB_REF" --github-sha "$GITHUB_SHA" \
            --pr-base-sha "$PR_BASE_SHA" --pr-head-sha "$PR_HEAD_SHA" \
            --push-sha "$PUSH_SHA" --output "$GITHUB_OUTPUT"
        else
          base_ref_valid=false
          expected_base=""
          expected_head=""
          full_fallback=false
          head_valid=false
          identity_valid=false
          if [[ "$GITHUB_EVENT_NAME" = "pull_request" ]]; then
            LC_ALL=C
            export LC_ALL
            if [[ "$PR_BASE_REF" != "@" && "$PR_BASE_REF_JSON" = \"*\" && \
                  ${#PR_BASE_REF} -le 1024 ]] && \
               /usr/bin/git check-ref-format "refs/heads/$PR_BASE_REF" \
                 > /dev/null 2>&1; then
              base_ref_valid=true
            fi
            if [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && \
                  "$PR_BASE_SHA_JSON" = "\"$PR_BASE_SHA\"" ]]; then
              expected_base="$PR_BASE_SHA"
            fi
            if [[ "$VALIDATED_FALLBACK_KIND" = "pull_request" && \
                  "$VALIDATED_FALLBACK_SHA" = "$PR_HEAD_SHA" ]]; then
              expected_head="$VALIDATED_FALLBACK_SHA"
              head_valid=true
            fi
            if [[ -n "$expected_base" && -n "$expected_head" && \
                  "$base_ref_valid" = true ]]; then
              identity_valid=true
            elif [[ "$head_valid" = true ]]; then
              full_fallback=true
            fi
          elif [[ "$VALIDATED_FALLBACK_KIND" = "push" && \
                  "$VALIDATED_FALLBACK_SHA" = "$PUSH_SHA" ]]; then
            expected_head="$VALIDATED_FALLBACK_SHA"
            head_valid=true
            identity_valid=true
          fi
          {
            echo "classification=full"
            echo "reason=classifier-bootstrap"
            echo "expected_base=$expected_base"
            echo "expected_head=$expected_head"
            echo "full_fallback=$full_fallback"
            echo "head_valid=$head_valid"
            echo "identity_valid=$identity_valid"
            echo "run_expensive=true"
          } >> "$GITHUB_OUTPUT"
        fi

  event-classifier:
    name: ${{ needs.event-router.result == 'success' && needs.event-router.outputs.classification == 'metadata-only' && 'metadata-classifier' || 'event-classifier' }}
    if: always()
    needs: [event-identity, event-router]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification: ${{ needs.event-router.outputs.classification }}
      expected_base: ${{ needs.event-router.outputs.expected_base }}
      expected_head: ${{ needs.event-router.outputs.expected_head }}
      full_fallback: ${{ needs.event-router.outputs.full_fallback }}
      head_valid: ${{ needs.event-router.outputs.head_valid }}
      identity_valid: ${{ needs.event-router.outputs.identity_valid }}
      reason: ${{ needs.event-router.outputs.reason }}
      run_expensive: ${{ needs.event-router.outputs.run_expensive }}
    env:
      CLASSIFICATION: ${{ needs.event-router.outputs.classification }}
      CLASSIFIED_HEAD: ${{ needs.event-router.outputs.expected_head }}
      EVENT_IDENTITY_RESULT: ${{ needs.event-identity.result }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SHA: ${{ github.sha }}
      FULL_FALLBACK: ${{ needs.event-router.outputs.full_fallback }}
      HEAD_VALID: ${{ needs.event-router.outputs.head_valid }}
      IDENTITY_VALID: ${{ needs.event-router.outputs.identity_valid }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ROUTER_RESULT: ${{ needs.event-router.result }}
      RUN_EXPENSIVE: ${{ needs.event-router.outputs.run_expensive }}
      TRUSTED_EVENT_KIND: ${{ needs.event-identity.outputs.fallback_kind }}
      TRUSTED_EVENT_SHA: ${{ needs.event-identity.outputs.fallback_sha }}
      PUSH_SHA: ${{ github.event.after }}

    steps:
    - name: Verify authoritative Build event mode
      run: |
        if [ "$ROUTER_RESULT" != "success" ]; then
          echo "Build event router did not succeed: $ROUTER_RESULT" >&2
          exit 1
        fi
        if [ "$EVENT_IDENTITY_RESULT" != "success" ]; then
          echo "trusted Build event identity did not succeed: $EVENT_IDENTITY_RESULT" >&2
          exit 1
        fi
        if [ "$EVENT_NAME" = "pull_request" ]; then
          if [ "$TRUSTED_EVENT_KIND" != "pull_request" ] || \
             [ -z "$TRUSTED_EVENT_SHA" ] || \
             [ "$TRUSTED_EVENT_SHA" != "$PR_HEAD_SHA" ] || \
             [ "$TRUSTED_EVENT_SHA" != "$CLASSIFIED_HEAD" ]; then
            echo "classified PR head lacks coherent trusted event identity" >&2
            exit 1
          fi
        elif [ "$EVENT_NAME" = "push" ]; then
          if [ "$TRUSTED_EVENT_KIND" != "push" ] || \
             [ -z "$TRUSTED_EVENT_SHA" ] || \
             [ "$TRUSTED_EVENT_SHA" != "$PUSH_SHA" ] || \
             [ "$TRUSTED_EVENT_SHA" != "$EVENT_SHA" ] || \
             [ "$TRUSTED_EVENT_SHA" != "$CLASSIFIED_HEAD" ]; then
            echo "classified push head lacks coherent trusted event identity" >&2
            exit 1
          fi
        else
          echo "classified event has no trusted identity mode" >&2
          exit 1
        fi
        case "$HEAD_VALID" in
          true|false) ;;
          *) echo "Build event router returned invalid head validity" >&2; exit 1 ;;
        esac
        case "$FULL_FALLBACK" in
          true|false) ;;
          *) echo "Build event router returned invalid full fallback" >&2; exit 1 ;;
        esac
        case "$IDENTITY_VALID" in
          true|false) ;;
          *) echo "Build event router returned invalid identity validity" >&2; exit 1 ;;
        esac
        if [ "$CLASSIFICATION" = "metadata-only" ]; then
          if [ "$EVENT_NAME" != "pull_request" ] || \
             [ "$TRUSTED_EVENT_KIND" != "pull_request" ] || \
             [ "$FULL_FALLBACK" != "false" ] || [ "$HEAD_VALID" != "true" ] || \
             [ "$IDENTITY_VALID" != "true" ] || \
             [ "$RUN_EXPENSIVE" != "false" ]; then
            echo "metadata event mode is not authoritative" >&2
            exit 1
          fi
          exit 0
        fi
        if [ "$CLASSIFICATION" != "full" ] || [ "$RUN_EXPENSIVE" != "true" ]; then
          echo "full Build event mode is not authoritative" >&2
          exit 1
        fi
        if [ "$FULL_FALLBACK" = "true" ] && \
           { [ "$HEAD_VALID" != "true" ] || [ "$IDENTITY_VALID" != "false" ]; }; then
          echo "full fallback mode is not authoritative" >&2
          exit 1
        fi

  # Fast, host-only lane (issues #13 + #12/#15): exercises every
  # tools/gba-playtest host test -- scenario/schema parsing, generators,
  # config, save/migration fixtures, timeouts, retry policy, deterministic
  # sorted-JSON output, and provenance/diagnostics -- and the pure-stdlib
  # upstream-port review tooling suite (tests/upstream_port:
  # classify/scan/drift/state/ref-binding/output-safety/merge-commit and the
  # verify.gates() <-> build.yml mirror), plus the stdlib-only workflow
  # contract suite under tests/workflows and workflow-pilot reporter
  # regression suite. None needs the arm-none-eabi cross-toolchain or a
  # 16 MB ROM build. Only a native C compiler
  # (build-essential) and libmgba-dev are installed, since the one integration
  # test that actually drives libmGBA (test_backend_integration.py) compiles
  # its tiny backend for the *host*, never the GBA target; the upstream-port
  # tests are Python/stdlib only and link no C. This is intentionally a
  # separate job from `build` below so host-only regressions are reported
  # before paying for a full ROM/linker build. The exhaustive full-game
  # localization gate is intentionally measured in minutes. Keep a 60-minute
  # budget: a normal run is roughly 34 minutes including setup, but shared
  # runner variance has reached the former 45-minute ceiling.
  # All host test steps are genuine gates (required status), not advisory.
  # Live branch protection currently requires the canonical `host-tests`,
  # `build`, and `summary` contexts. Metadata-only PR edits therefore run only
  # a trusted no-checkout continuity attestation in `host-tests`/`build`;
  # every existing checkout/install/test/build step remains full/fallback-only.
  # `extended-host-tests` and `legacy` stay platform-skipped for metadata
  # edits, the required `summary` context advances to the later metadata
  # continuity run, and candidate eligibility still remains bound to the
  # newest prior complete full Build CI run.
  host-tests:
    needs: [event-identity, event-classifier]
    if: ${{ always() && ((needs.event-classifier.result == 'success' && needs.event-identity.result == 'success' && needs.event-classifier.outputs.classification == 'metadata-only' && needs.event-classifier.outputs.head_valid == 'true' && needs.event-classifier.outputs.identity_valid == 'true' && needs.event-classifier.outputs.full_fallback == 'false' && needs.event-classifier.outputs.run_expensive == 'false' && github.event_name == 'pull_request' && needs.event-identity.outputs.fallback_kind == 'pull_request' && needs.event-identity.outputs.fallback_sha == needs.event-classifier.outputs.expected_head && needs.event-classifier.outputs.expected_head == github.event.pull_request.head.sha && needs.event-classifier.outputs.expected_base == github.event.pull_request.base.sha && github.event.pull_request.head.sha != '' && github.event.pull_request.base.sha != '') || (needs.event-classifier.result == 'success' && needs.event-identity.result == 'success' && needs.event-classifier.outputs.classification == 'full' && needs.event-classifier.outputs.head_valid == 'true' && needs.event-classifier.outputs.run_expensive == 'true' && ((github.event_name == 'pull_request' && needs.event-identity.outputs.fallback_kind == 'pull_request' && needs.event-identity.outputs.fallback_sha == needs.event-classifier.outputs.expected_head && needs.event-classifier.outputs.expected_head == github.event.pull_request.head.sha && github.event.pull_request.head.sha != '' && (needs.event-classifier.outputs.identity_valid == 'true' || needs.event-classifier.outputs.full_fallback == 'true')) || (github.event_name == 'push' && needs.event-identity.outputs.fallback_kind == 'push' && needs.event-identity.outputs.fallback_sha == needs.event-classifier.outputs.expected_head && needs.event-identity.outputs.fallback_sha == github.sha && needs.event-classifier.outputs.identity_valid == 'true' && needs.event-classifier.outputs.expected_head == github.event.after && needs.event-classifier.outputs.expected_base == '' && github.event.after != ''))) || (needs.event-classifier.result == 'failure' && needs.event-identity.result == 'success' && ((github.event_name == 'pull_request' && needs.event-identity.outputs.fallback_kind == 'pull_request' && needs.event-identity.outputs.fallback_sha == github.event.pull_request.head.sha) || (github.event_name == 'push' && needs.event-identity.outputs.fallback_kind == 'push' && needs.event-identity.outputs.fallback_sha == github.event.after && needs.event-identity.outputs.fallback_sha == github.sha)))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_BUILD_SHA: ${{ (needs.event-classifier.result == 'success' && needs.event-classifier.outputs.expected_head) || (needs.event-classifier.result == 'failure' && needs.event-identity.outputs.fallback_sha) || '' }}

    steps:
    - name: Attest metadata-only branch-protection continuity
      if: ${{ needs.event-classifier.result == 'success' && needs.event-classifier.outputs.classification == 'metadata-only' }}
      env:
        BASH_ENV: ''
        CLASSIFICATION: ${{ needs.event-classifier.outputs.classification }}
        CLASSIFIED_BASE_SHA: ${{ needs.event-classifier.outputs.expected_base }}
        CLASSIFIED_BUILD_SHA: ${{ needs.event-classifier.outputs.expected_head }}
        CLASSIFIER_RESULT: ${{ needs.event-classifier.result }}
        ENV: ''
        FALLBACK_IDENTITY_RESULT: ${{ needs.event-identity.result }}
        FALLBACK_KIND: ${{ needs.event-identity.outputs.fallback_kind }}
        FALLBACK_SHA: ${{ needs.event-identity.outputs.fallback_sha }}
        FULL_FALLBACK: ${{ needs.event-classifier.outputs.full_fallback }}
        HEAD_VALID: ${{ needs.event-classifier.outputs.head_valid }}
        IDENTITY_VALID: ${{ needs.event-classifier.outputs.identity_valid }}
        PATH: /usr/bin:/bin
        RUN_EXPENSIVE: ${{ needs.event-classifier.outputs.run_expensive }}
      run: |
        if [ "$CLASSIFIER_RESULT" != "success" ] || \
           [ "$FALLBACK_IDENTITY_RESULT" != "success" ] || \
           [ "$GITHUB_EVENT_NAME" != "pull_request" ] || \
           [ "$CLASSIFICATION" != "metadata-only" ] || \
           [ "$FALLBACK_KIND" != "pull_request" ] || \
           [ -z "$FALLBACK_SHA" ] || \
           [ "$FULL_FALLBACK" != "false" ] || [ "$HEAD_VALID" != "true" ] || \
           [ "$IDENTITY_VALID" != "true" ] || [ "$RUN_EXPENSIVE" != "false" ] || \
           [ "$EXPECTED_BUILD_SHA" != "$CLASSIFIED_BUILD_SHA" ] || \
           [ "$FALLBACK_SHA" != "$CLASSIFIED_BUILD_SHA" ]; then
          echo "metadata-only branch-protection continuity is not authoritative" >&2
          exit 1
        fi
        /usr/bin/python3 -I - <<'PY'
        import decimal
        import json
        import math
        import os
        import re
        import stat
        import sys

        MAX_EVENT_PATH_BYTES = 4096
        MAX_EVENT_REF_BYTES = 128
        MAX_NUMBER_BYTES = 20
        MAX_REF_BYTES = 1024
        MAX_EVENT_BYTES = 1048576
        MAX_EVENT_READ_BYTES = MAX_EVENT_BYTES + 1
        MAX_FLOAT_LITERAL_BYTES = 128
        MAX_TITLE_BYTES = 65536
        MAX_BODY_BYTES = MAX_EVENT_BYTES
        SHA_RE = re.compile(r"^[0-9a-f]{40}$")
        NUMBER_RE = re.compile(r"^[1-9][0-9]{0,18}$")
        ALLOWED_CHANGE_KEYS = (
            frozenset({"body"}),
            frozenset({"title"}),
            frozenset({"body", "title"}),
        )
        EVENT_FILE_FLAGS = (
            os.O_RDONLY
            | getattr(os, "O_CLOEXEC", 0)
            | getattr(os, "O_NOFOLLOW", 0)
            | getattr(os, "O_NONBLOCK", 0)
        )

        def fail(message):
            print(message, file=sys.stderr)
            raise SystemExit(1)

        def utf8_len(value):
            return len(value.encode("utf-8"))

        def env(name, *, max_bytes):
            value = os.environ.get(name)
            if value is None or value == "":
                fail(f"metadata-only raw event missing {name}")
            if utf8_len(value) > max_bytes:
                fail(f"metadata-only raw event {name} exceeds bounds")
            return value

        def reject_duplicates(pairs):
            result = {}
            for key, value in pairs:
                if key in result:
                    fail("metadata-only raw event JSON repeats a key")
                result[key] = value
            return result

        def reject_nonfinite_constant(value):
            fail(f"metadata-only raw event JSON contains non-finite number {value}")

        def parse_strict_float(value):
            if len(value) > MAX_FLOAT_LITERAL_BYTES:
                fail("metadata-only raw event JSON float literal is too long")
            try:
                decimal_value = decimal.Decimal(value)
                float_value = float(decimal_value)
            except (decimal.InvalidOperation, OverflowError, ValueError):
                fail(f"metadata-only raw event JSON float is invalid: {value}")
            if not math.isfinite(float_value):
                fail(f"metadata-only raw event JSON float overflows: {value}")
            if decimal_value != 0 and float_value == 0:
                fail(f"metadata-only raw event JSON float underflows: {value}")
            return float_value

        def ensure_finite_numbers(value):
            if isinstance(value, float):
                if not math.isfinite(value):
                    fail("metadata-only raw event JSON contains non-finite float")
                return
            if isinstance(value, dict):
                for item in value.values():
                    ensure_finite_numbers(item)
                return
            if isinstance(value, list):
                for item in value:
                    ensure_finite_numbers(item)

        def parse_required_text(value, *, field, max_bytes):
            if not isinstance(value, str) or value == "":
                fail(f"metadata-only raw event {field} is invalid")
            if utf8_len(value) > max_bytes:
                fail(f"metadata-only raw event {field} exceeds bounds")
            return value

        def parse_title_text(value, *, field, max_bytes):
            text = parse_required_text(value, field=field, max_bytes=max_bytes)
            if not text.strip():
                fail(f"metadata-only raw event {field} is invalid")
            return text

        def is_git_branch_ref(value):
            if not isinstance(value, str) or not value or value == "@":
                return False
            try:
                if utf8_len(value) > MAX_REF_BYTES:
                    return False
            except UnicodeEncodeError:
                return False
            if (
                value.startswith("/")
                or value.endswith("/")
                or value.endswith(".")
                or "//" in value
                or ".." in value
                or "@{" in value
            ):
                return False
            if any(
                ord(character) < 0x20
                or ord(character) == 0x7F
                or character in " ~^:?*[\\"
                for character in value
            ):
                return False
            return all(
                component
                and not component.startswith(".")
                and not component.endswith(".lock")
                for component in value.split("/")
            )

        def parse_sha(value, *, field):
            if not isinstance(value, str) or SHA_RE.fullmatch(value) is None:
                fail(f"metadata-only raw event {field} is invalid")
            return value

        def file_signature(metadata):
            return (
                metadata.st_dev,
                metadata.st_ino,
                metadata.st_mode,
                metadata.st_uid,
                metadata.st_size,
                getattr(metadata, "st_mtime_ns", 0),
                getattr(metadata, "st_ctime_ns", 0),
            )

        def load_event_payload():
            event_path = env("GITHUB_EVENT_PATH", max_bytes=MAX_EVENT_PATH_BYTES)
            try:
                metadata = os.lstat(event_path)
            except OSError as error:
                fail(f"metadata-only raw event cannot inspect payload: {error}")
            if stat.S_ISLNK(metadata.st_mode) or not stat.S_ISREG(metadata.st_mode):
                fail("metadata-only raw event payload must be a regular file")
            if metadata.st_uid != os.getuid():
                fail("metadata-only raw event payload owner is invalid")
            if metadata.st_size > MAX_EVENT_BYTES:
                fail("metadata-only raw event payload exceeds 1 MiB")
            try:
                fd = os.open(event_path, EVENT_FILE_FLAGS)
            except OSError as error:
                fail(f"metadata-only raw event cannot open payload: {error}")
            try:
                opened = os.fstat(fd)
                if not stat.S_ISREG(opened.st_mode):
                    fail("metadata-only raw event payload must be a regular file")
                if opened.st_uid != metadata.st_uid or opened.st_uid != os.getuid():
                    fail("metadata-only raw event payload owner is invalid")
                if file_signature(opened) != file_signature(metadata):
                    fail("metadata-only raw event payload changed before read")
                raw = bytearray()
                while len(raw) < MAX_EVENT_READ_BYTES:
                    chunk = os.read(fd, min(65536, MAX_EVENT_READ_BYTES - len(raw)))
                    if not chunk:
                        break
                    raw.extend(chunk)
                final = os.fstat(fd)
            except OSError as error:
                fail(f"metadata-only raw event cannot read payload: {error}")
            finally:
                os.close(fd)
            if len(raw) > MAX_EVENT_BYTES:
                fail("metadata-only raw event payload exceeds 1 MiB")
            if file_signature(final) != file_signature(opened) or len(raw) != opened.st_size:
                fail("metadata-only raw event payload changed while being read")
