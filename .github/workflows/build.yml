    # not modify, reorder, or relax the linker-check step above, and it does
    # not touch any committed fingerprint/baseline.
    #
    # Issue #6 (Sprint 2) rides this SAME step and this SAME ROM build: the
    # EXPANSION_STARTER_CONTENT=1 EXPANSION_MECHANICS_HOOKS=1
    # EXPANSION_MECHANICS_SAMPLE=1 profile links the bundled generated-data
