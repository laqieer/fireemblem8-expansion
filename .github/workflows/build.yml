        PYTHONPATH: ''
        SHELLOPTS: ''
      run: |
        cleanup_private_base() {
          status="$?"
          cleanup_failed=0
          trap - EXIT INT TERM
          set +e
          case "$BASE_IMAGE" in
            "$RUNNER_TEMP"/patch-private.??????????/base.gba)
              private_dir="${BASE_IMAGE%/base.gba}"
              /bin/chmod u+w -- "$BASE_IMAGE" > /dev/null 2>&1 || cleanup_failed=1
              /bin/rm -f -- "$BASE_IMAGE" > /dev/null 2>&1 || cleanup_failed=1
              /usr/bin/rmdir -- "$private_dir" > /dev/null 2>&1 || cleanup_failed=1
              ;;
            *)
              echo "refusing cleanup outside the trusted private path" >&2
              cleanup_failed=1
              ;;
          esac
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          exit "$cleanup_failed"
        }
        trap cleanup_private_base EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        case "$BASE_IMAGE" in
          "$RUNNER_TEMP"/patch-private.??????????/base.gba) ;;
          *) echo "private base path is outside the trusted boundary" >&2; exit 1 ;;
        esac
        test -f "$BASE_IMAGE"
        test ! -L "$BASE_IMAGE"
        test "$(/usr/bin/stat -c %F "$BASE_IMAGE")" = "regular file"
        test "$(/usr/bin/stat -c %h "$BASE_IMAGE")" = 1
        test "$(/usr/bin/stat -c %a "$BASE_IMAGE")" = 400
        test "$(/usr/bin/stat -c %s "$BASE_IMAGE")" = 16777216
        input_names="$(/usr/bin/find "$PATCH_INPUT_ROOT" -mindepth 1 \
          -maxdepth 1 -printf '%f\n' | LC_ALL=C /usr/bin/sort)"
        test "$input_names" = "$(printf 'metadata.json\ntarget.gba')"
        for input in "$PATCH_INPUT_ROOT/target.gba" \
          "$PATCH_INPUT_ROOT/metadata.json"
        do
          test -f "$input"
          test ! -L "$input"
          test "$(/usr/bin/stat -c %F "$input")" = "regular file"
          test "$(/usr/bin/stat -c %h "$input")" = 1
          test "$(/usr/bin/stat -c %a "$input")" = 400
        done
        cd "$PATCH_RUNTIME_ROOT"
        /usr/bin/env -i HOME="$PATCH_RUNTIME_ROOT" PATH=/usr/bin:/bin LC_ALL=C \
          /usr/bin/python3 -I -S -c \
          'import sys; sys.path.insert(0, sys.argv.pop(1)); from scripts.modernize.patch_release import main; raise SystemExit(main(sys.argv[1:]))' \
          "$PATCH_TOOL_ROOT" create \
          --base "$BASE_IMAGE" \
          --target "$PATCH_INPUT_ROOT/target.gba" \
          --metadata "$PATCH_INPUT_ROOT/metadata.json" \
          --output-dir "$PATCH_ARTIFACT_DIR" \
          --commit "$PATCH_COMMIT"
        /usr/bin/env -i HOME="$PATCH_RUNTIME_ROOT" PATH=/usr/bin:/bin LC_ALL=C \
          /usr/bin/python3 -I -S -c \
          'import sys; sys.path.insert(0, sys.argv.pop(1)); from scripts.modernize.patch_release import main; raise SystemExit(main(sys.argv[1:]))' \
          "$PATCH_TOOL_ROOT" verify \
          --base "$BASE_IMAGE" \
          --artifact-dir "$PATCH_ARTIFACT_DIR"
        LC_ALL=C
        export LC_ALL
        artifact_names="$(/usr/bin/find "$PATCH_ARTIFACT_DIR" -mindepth 1 \
          -maxdepth 1 -printf '%f\n' | /usr/bin/sort)"
        test "$artifact_names" = \
          "$(printf '%s\n' README.txt \
            fireemblem8-expansion-all-locales-all-features-aapcs.bps \
            manifest.json | /usr/bin/sort)"
        for artifact in "$PATCH_ARTIFACT_DIR/README.txt" \
          "$PATCH_ARTIFACT_DIR/fireemblem8-expansion-all-locales-all-features-aapcs.bps" \
          "$PATCH_ARTIFACT_DIR/manifest.json"
        do
          test -f "$artifact"
          test ! -L "$artifact"
          test "$(/usr/bin/stat -c %F "$artifact")" = "regular file"
          test "$(/usr/bin/stat -c %h "$artifact")" = 1
        done

    - name: Cleanup and verify private base
      if: always()
