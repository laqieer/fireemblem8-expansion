        /usr/bin/sudo /usr/bin/mkdir -- "$builder_cgroup"
        builder_cgroup_owned=1
        test -f "$builder_cgroup/cgroup.kill"
        test -f "$builder_cgroup/cgroup.procs"
        test -r "$builder_cgroup/cgroup.procs"
        builder_cgroup_is_empty
        host_uid="$(/usr/bin/id -u)"
        host_gid="$(/usr/bin/id -g)"
        builder_isolation_script="$(/bin/cat \
          "$BUILDER_ROOT/control/builder-isolation.sh")"
        test -n "$builder_isolation_script"
        [[ "$shell_pgid" =~ ^[1-9][0-9]*$ ]]
        set +m
        /usr/bin/python3 -I -S \
          "$BUILDER_ROOT/control/supervisor-launcher.py" "$$" -- \
          /usr/bin/timeout --signal=TERM --kill-after=30s 55m \
          /usr/bin/sudo /usr/bin/unshare --fork \
          --kill-child=KILL --mount --pid --mount-proc --net --ipc --uts \
          /bin/bash -c "$builder_isolation_script" builder-isolation \
          "$builder_cgroup" "$builder_uid" "$builder_gid" \
          "$BUILDER_ROOT" "$RUNNER_TEMP" \
          "$BUILDER_ROOT/control/candidate-build.sh" \
          "$BUILDER_ROOT/control/candidate-launcher.py" \
          "$host_uid" "$host_gid" \
          < /dev/null > /dev/null 2>&1 &
        builder_supervisor_pid="$!"
        builder_supervisor_wait_pid="$builder_supervisor_pid"
        builder_launch_detail=session-timeout
        for attempt in $(/usr/bin/seq 1 100); do
          if ! /bin/kill -0 "$builder_supervisor_pid" \
            > /dev/null 2>&1
          then
            builder_launch_detail=session-exit
            break
          fi
          set +e
          builder_identity="$(read_builder_identity "$builder_supervisor_pid")"
          builder_identity_status="$?"
          set -e
          if [ "$builder_identity_status" -ne 0 ]; then
            builder_launch_detail=session-query
          elif ! [[ "$builder_identity" =~ ^([1-9][0-9]*)[[:space:]]+([1-9][0-9]*)[[:space:]]+([1-9][0-9]*)[[:space:]]+([^[:space:]]+)[[:space:]]+([1-9][0-9]*)$ ]]; then
            builder_launch_detail=session-format
          elif [ "${BASH_REMATCH[1]}" = "$builder_supervisor_parent_pid" ] && \
               [ "${BASH_REMATCH[2]}" = "$builder_supervisor_pid" ] && \
               [ "${BASH_REMATCH[3]}" = "$builder_supervisor_pid" ]; then
            if [[ "${BASH_REMATCH[4]}" = T* ]]; then
              builder_session_id="$builder_supervisor_pid"
              builder_supervisor_starttime="${BASH_REMATCH[5]}"
              builder_supervisor_state=stopped
              builder_session_authenticated=1
              builder_launch_detail=session-ready
              break
            fi
            builder_launch_detail=session-state
          elif [ "${BASH_REMATCH[3]}" = "$shell_pgid" ]; then
            builder_launch_detail=session-parent
          else
            builder_launch_detail=session-mismatch
            break
          fi
          /bin/sleep 0.01
        done
        if [ "$builder_launch_detail" != session-ready ]; then
          builder_status=125
          printf 'candidate build failed: stage=launch detail=%s exit=%d\n' \
            "$builder_launch_detail" "$builder_status" >&2
          exit "$builder_status"
        fi
        if ! builder_supervisor_identity_matches stopped || \
           ! /bin/kill -CONT "$builder_supervisor_pid" \
          > /dev/null 2>&1
        then
          builder_status=125
          printf 'candidate build failed: stage=launch detail=session-resume exit=%d\n' \
            "$builder_status" >&2
          exit "$builder_status"
        fi
        builder_supervisor_state=starting
        builder_launch_detail=session-start-timeout
        for attempt in $(/usr/bin/seq 1 100); do
          if builder_supervisor_identity_matches running; then
            builder_supervisor_state=running
            builder_launch_detail=session-started
            break
          fi
          if builder_supervisor_identity_matches zombie; then
            builder_launch_detail=session-exit
            break
          fi
          /bin/sleep 0.01
        done
        if [ "$builder_launch_detail" != session-started ]; then
          builder_status=125
          printf 'candidate build failed: stage=launch detail=%s exit=%d\n' \
            "$builder_launch_detail" "$builder_status" >&2
          exit "$builder_status"
        fi
        set +e
        wait "$builder_supervisor_pid"
        builder_status="$?"
        set -e
        builder_supervisor_pid=""
        builder_supervisor_wait_pid=""
        if [ "$builder_status" -ne 0 ]; then
          printf 'candidate build failed: stage=isolated exit=%d\n' \
            "$builder_status" >&2
          exit "$builder_status"
        fi
        printf 'candidate build status: success\n'
        builder_group_is_empty "$builder_session_id"
        builder_cgroup_is_empty
        builder_uid_is_empty "$builder_uid"
        remove_builder_cgroup
        test ! -e "$builder_cgroup"
        handoff_root="$BUILDER_ROOT/handoff"
        test -d "$handoff_root"
        test ! -L "$handoff_root"
        test "$(/usr/bin/realpath "$handoff_root")" = "$handoff_root"
        test "$(/usr/bin/stat -c %u "$handoff_root")" = "$host_uid"
        handoff_names="$(/usr/bin/find "$handoff_root" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C /usr/bin/sort)"
        test "$handoff_names" = "$(printf 'metadata.json\ntarget.gba')"
        target_source="$handoff_root/target.gba"
        metadata_source="$handoff_root/metadata.json"
        for source in "$target_source" "$metadata_source"; do
          test -f "$source"
          test ! -L "$source"
          test "$(/usr/bin/stat -c %F "$source")" = "regular file"
          test "$(/usr/bin/stat -c %h "$source")" = 1
          test "$(/usr/bin/stat -c %u "$source")" = "$host_uid"
          case "$(/usr/bin/realpath "$source")" in
            "$handoff_root"/*) ;;
            *) echo "builder output escaped isolated handoff" >&2; exit 1 ;;
          esac
        done
        test "$(/usr/bin/stat -c %s "$target_source")" = 33554432
        metadata_size="$(/usr/bin/stat -c %s "$metadata_source")"
        test "$metadata_size" -gt 0
        test "$metadata_size" -le 1048576
        /bin/rm -rf -- "$PATCH_INPUT_ROOT"
        /usr/bin/install -d -m 0700 "$PATCH_INPUT_ROOT"
        /usr/bin/install -m 0400 "$target_source" \
          "$PATCH_INPUT_ROOT/target.gba"
        /usr/bin/install -m 0400 "$metadata_source" \
          "$PATCH_INPUT_ROOT/metadata.json"
        /usr/bin/find "$GITHUB_WORKSPACE_PATH" -mindepth 1 -delete
        test -z "$(/usr/bin/find "$GITHUB_WORKSPACE_PATH" -mindepth 1 -print -quit)"
        terminate_builder_processes
        remove_builder_cgroup
        remove_builder_state
        trap - EXIT INT TERM
        builder_group_is_empty "$builder_session_id"
        test ! -e "$builder_cgroup"
        builder_uid_is_empty "$builder_uid"
        builder_passwd_entry_absent "$builder_user"
        test ! -e "$BUILDER_ROOT"
        test ! -e "$PATCH_WHEELHOUSE"
        input_names="$(/usr/bin/find "$PATCH_INPUT_ROOT" -mindepth 1 \
          -maxdepth 1 -printf '%f\n' | LC_ALL=C /usr/bin/sort)"
        test "$input_names" = "$(printf 'metadata.json\ntarget.gba')"
        for input in "$PATCH_INPUT_ROOT/target.gba" \
          "$PATCH_INPUT_ROOT/metadata.json"
        do
          test -f "$input"
          test ! -L "$input"
          test "$(/usr/bin/stat -c %F "$input")" = "regular file"
          test "$(/usr/bin/stat -c %h "$input")" = 1
          test "$(/usr/bin/stat -c %a "$input")" = 400
        done
        /usr/bin/env -i HOME="$PATCH_RUNTIME_ROOT" PATH=/usr/bin:/bin LC_ALL=C \
          /usr/bin/python3 -I -S -c \
          'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(value, dict); assert value.get("build_commit") == sys.argv[2]' \
          "$PATCH_INPUT_ROOT/metadata.json" "$PATCH_COMMIT"

    - name: Download private base image
      id: private-base
      shell: /bin/bash --noprofile --norc -euo pipefail {0}
      env:
        BASH_ENV: ''
        BASEROM_URL: ${{ secrets.BASEROM_URL }}
        CDPATH: ''
        ENV: ''
        GLOBIGNORE: ''
        GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
        GIT_CEILING_DIRECTORIES: ''
        GIT_COMMON_DIR: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_KEY_0: ''
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_PARAMETERS: ''
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_VALUE_0: ''
        GIT_DIR: ''
        GIT_EXEC_PATH: ''
        GIT_INDEX_FILE: ''
        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
