        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_OBJECT_DIRECTORY: ''
        GIT_REPLACE_REF_BASE: ''
        GIT_WORK_TREE: ''
        HOME: ${{ runner.temp }}/patch-runtime
