name: Build CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  # Fast, host-only lane (issues #13 + #12/#15): exercises every
  # tools/gba-playtest host test -- scenario/schema parsing, generators,
  # config, save/migration fixtures, timeouts, retry policy, deterministic
  # sorted-JSON output, and provenance/diagnostics -- and the pure-stdlib
  # upstream-port review tooling suite (tests/upstream_port:
  # classify/scan/drift/state/ref-binding/output-safety/merge-commit and the
  # verify.gates() <-> build.yml mirror), plus the stdlib-only workflow
  # contract suite under tests/workflows and workflow-pilot reporter
  # regression suite. None needs the arm-none-eabi cross-toolchain or a
  # 16 MB ROM build. Only a native C compiler
  # (build-essential) and libmgba-dev are installed, since the one integration
  # test that actually drives libmGBA (test_backend_integration.py) compiles
  # its tiny backend for the *host*, never the GBA target; the upstream-port
  # tests are Python/stdlib only and link no C. This is intentionally a
  # separate job from `build` below so host-only regressions are reported
  # before paying for a full ROM/linker build. The exhaustive full-game
  # localization gate is intentionally measured in minutes. Keep a 60-minute
  # budget: a normal run is roughly 34 minutes including setup, but shared
  # runner variance has reached the former 45-minute ceiling.
  # All host test steps are genuine gates (required status), not advisory.
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_BUILD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Verify checked-out revision
      run: |
        ACTUAL_SHA="$(git rev-parse HEAD)"
        printf 'checkout.sha=%s\n' "$ACTUAL_SHA"
        test "$ACTUAL_SHA" = "$EXPECTED_BUILD_SHA"

    # Exact-ref checkout can omit force-pushed historical fixture commits.
    # The CI-only helper derives exact object IDs from the committed fixture,
    # fetches only missing commits without refs/tags/eager blobs, and proves
    # both refs and the candidate checkout remain unchanged.
    - name: Hydrate workflow-pilot Git authority
      env:
        BASH_ENV: ''
        ENV: ''
        GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
        GIT_CEILING_DIRECTORIES: ''
        GIT_COMMON_DIR: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_KEY_0: ''
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_PARAMETERS: ''
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_VALUE_0: ''
        GIT_DIR: ''
        GIT_EXEC_PATH: ''
        GIT_INDEX_FILE: ''
        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_OBJECT_DIRECTORY: ''
        GIT_REPLACE_REF_BASE: ''
        GIT_WORK_TREE: ''
        PATH: /usr/bin:/bin
        PYTHONPATH: ''
      run: /usr/bin/python3 -I scripts/workflow_pilot/isolated_launcher.py hydrate --repository-root "$GITHUB_WORKSPACE" --fixture scripts/workflow_pilot/tests/fixtures/baseline.json --expected-head "$EXPECTED_BUILD_SHA"

    - name: Install host-only dependencies (no arm-none-eabi toolchain)
      run: sudo apt-get update && sudo apt-get install -y build-essential libmgba-dev

    # GBA_PLAYTEST_HOST_ONLY=1 is the single public switch that makes this a
    # genuinely host-only lane (tools/gba-playtest/tests/host_mode.py): every
    # ROM-dependent live-integration test skips explicitly, before it touches
    # any ROM/ELF/save artifact, instead of deciding live-vs-skip from whether
    # a git-ignored build artifact happens to exist. A clean CI checkout has
    # no ROM, so this job behaves identically here either way; the flag makes
    # that guarantee explicit and reproducible in a local worktree (and under
    # `python3 -m scripts.upstream_port verify --jobs 2`, where the ROM
    # `build` gates below rewrite exactly those artifacts while this gate
    # runs). The live/runtime coverage is owned by the `build` job below --
    # it is not weakened here. The env is inline on this one step only: the
    # `build` job must NOT inherit it, or its runtime gates would skip.
    - name: Run gba-playtest host test suite
      run: GBA_PLAYTEST_HOST_ONLY=1 python3 -m unittest discover -s tools/gba-playtest/tests -v

    # Issue #12/#15 upstream-port review tooling (scripts/upstream_port):
    # pure-stdlib unittest coverage for
    # classify/scan/drift/state/
    # ref-binding/output-safety/merge-commit determinism and, crucially, the
    # verify.gates() <-> this-workflow argv/order mirror. Runs here in the
    # host lane (no arm-none-eabi toolchain, no ROM/linker rebuild) as an
    # explicit required gate; scripts/upstream_port/verify.py re-states these
    # same gate commands, argv-identical and in order, so `verify` reproduces
    # this CI locally without a runner.
    - name: Run upstream-port tooling test suite
      run: python3 -m unittest discover -s tests/upstream_port -v

    # Consolidated Build CI topology contract: candidate/master triggers,
    # combined workers, evidence ownership, and fail-closed summary. Pure
    # stdlib/YAML-text parsing; no ROM/toolchain.
    - name: Run workflow contract test suite
      run: python3 -m unittest discover -s tests/workflows -p "test_*.py" -v

    - name: Run workflow-pilot reporter regression suite (issue #176)
      env:
        BASH_ENV: ''
        ENV: ''
        GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
        GIT_CEILING_DIRECTORIES: ''
        GIT_COMMON_DIR: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_KEY_0: ''
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_PARAMETERS: ''
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_VALUE_0: ''
        GIT_DIR: ''
        GIT_EXEC_PATH: ''
        GIT_INDEX_FILE: ''
        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_OBJECT_DIRECTORY: ''
        GIT_REPLACE_REF_BASE: ''
        GIT_WORK_TREE: ''
        PATH: /usr/bin:/bin
        PYTHONPATH: ''
      run: /usr/bin/python3 -I scripts/workflow_pilot/isolated_launcher.py reporter-tests

    - name: Validate workflow-pilot baseline against checked-out Git history
      env:
        BASH_ENV: ''
        ENV: ''
        GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
        GIT_CEILING_DIRECTORIES: ''
        GIT_COMMON_DIR: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_KEY_0: ''
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_PARAMETERS: ''
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_VALUE_0: ''
        GIT_DIR: ''
        GIT_EXEC_PATH: ''
        GIT_INDEX_FILE: ''
        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_OBJECT_DIRECTORY: ''
        GIT_REPLACE_REF_BASE: ''
        GIT_WORK_TREE: ''
        PATH: /usr/bin:/bin
        PYTHONPATH: ''
      run: /usr/bin/python3 -I scripts/workflow_pilot/isolated_launcher.py baseline --repository-root "$GITHUB_WORKSPACE" --fixture scripts/workflow_pilot/tests/fixtures/baseline.json --decisions .github/workflow-pilot-decisions.json --expected scripts/workflow_pilot/tests/fixtures/baseline_expected.json > /dev/null

    # Issue #18 host-lane closure fix: the scripts/localization package's
    # own pure-stdlib unit test suite (schema/pseudo/catalog/generate/CLI/
    # determinism, plus the host-native resolver-behavior and
    # vanilla-isolation source-audit tests, which self-skip without a host
    # `cc`) -- see localization.mk's `localization-test` target, whose own
    # comment already named it a CI-suitable gate before this step actually
    # wired it in. Python/stdlib only (no arm-none-eabi toolchain, no
    # ROM/linker rebuild), so it stays in this fast host lane; it does not
    # overlap the localization-runtime-*-check scenarios in the `build`
    # job below (those require a real booted ROM and are reached through
    # expansion-modern-linker-check's own dependency list, not this step).
    - name: Run localization host test suite (issue #18)
      run: python3 -m unittest discover -s scripts/localization/tests -p "test_*.py"

    # The full-game payload has a separate source format from the expansion
    # catalog. Its test target includes the typed rendered-width registry,
    # metrics-aware generated-break validation, and native text consumer
    # checks, so an overfull JA/ZH stream cannot pass the default CI lane.
    - name: Run full-game localization width contract (issue #18)
      run: |
        make game-localization-test
        python3 -m scripts.localization.game_locales check
        python3 -m scripts.localization.game_locales check-crosswalk
        python3 -m scripts.localization.game_locales check-raw-closure

  # Ubuntu libmGBA ROM/runtime gate: builds the full modern object/ELF/ROM
  # chain for both supported configs (debug, release; AAPCS only -- see
  # docs/config_identity.md), checks deterministic memory budgets, rejects
  # orphan/overflow/cross-overlay errors, and verifies boot/title/debugtools/
  # new-game/save-format/suspend-resume/shifted-link runtime behavior via
  # the same tools/gba-playtest harness the host-tests job unit-tests in
  # isolation, and finally re-runs that same harness at an expanded item ID
  # cap for the issue #10 item-ID-expansion runtime probe. This is the
  # exact (and only) supported CI host matrix today:
  # ubuntu-latest with arm-none-eabi GCC. macOS (Homebrew) is documented in
  # tools/gba-playtest/README.md for local development but is not exercised
  # by CI. The archival/decomp agbcc `fireemblem8.gba` path is deliberately
  # absent from this modern job; the parallel `legacy` job below owns its
  # archival CI evidence. Per repository policy, this job ends after its
  # target-ROM checks.
  build:
    runs-on: ubuntu-latest
    # A normal debug+release linker/runtime run is roughly 25 minutes, but
    # shared-runner variance has reached the former 30-minute ceiling.
    timeout-minutes: 60
    env:
      EXPECTED_BUILD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Verify checked-out revision
      run: |
        ACTUAL_SHA="$(git rev-parse HEAD)"
        printf 'checkout.sha=%s\n' "$ACTUAL_SHA"
        test "$ACTUAL_SHA" = "$EXPECTED_BUILD_SHA"

    # Runs against the immutable commit CI is building (not the mutable
    # worktree/index) and before Install dependencies/Build tools create any
    # build output, so a prohibited tracked artifact fails fast on Git object
    # content instead of being masked by later build products.
    - name: Check tracked artifacts
      run: |
        python3 -m unittest discover -s scripts/artifact_guard_tests -p 'test_*.py' -v
        python3 scripts/artifact_guard.py --revision HEAD

    # Issues #7/#17 closure: a fast, stdlib-only, zero-network,
    # zero-ROM documentation governance gate. Runs the checker's own
    # unittest suite, then the checker itself (100% Markdown-inventory
    # exact-coverage, internal link/anchor resolution, external-link
    # registry coverage, stale-command/path denylist, and statically
    # parsed -- never executed -- Makefile-target existence), plus a
    # small hardcoded allowlist of --help-only example commands. Placed
    # immediately after the artifact guard and before dependency
    # install/tool build/ROM linker gates below, so a documentation
    # regression fails in seconds instead of after a multi-minute build.
    - name: Check documentation (issues #7/#17)
      run: |
        python3 -m unittest discover -s scripts/docs_check_tests -v
        python3 scripts/check_docs.py --check --check-examples

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev pkg-config gcc-arm-none-eabi libnewlib-arm-none-eabi libmgba-dev
        python3 -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/requirements/build.txt

    - name: Build tools
      run: ./build_tools.sh

    - name: Run CodeQL alert regression suite (issue #84)
      run: make codeql-alerts-test CODEQL_REQUIRE_FANALYZER=1

    # Issue #15 closure: a bare `make`/`make all` must unconditionally
    # resolve to the modern release AAPCS boot-check chain, with the
    # archival agbcc lane reachable only by explicitly naming `make
    # legacy`/`make fireemblem8.gba` -- never via any environment variable
    # or `make` command-line variable override. These targeted tests are
    # stdlib `unittest` only (no pytest/network installs) and are dry-run/
    # database-probe based against the real Makefile/quickstart.sh (never a
    # real multi-minute compile/link/boot-check), so they run early and
    # fail fast on any structural regression before the slower linker gate
    # below.
    - name: Check default build lane and quickstart legacy glue (issue #15)
      run: |
        python3 -m unittest discover -s scripts/modernize/tests -p "test_build_default_lane.py" -v
        python3 -m unittest discover -s scripts/modernize/tests -p "test_quickstart.py" -v

    # Generated-data platform (Issue #5 Chapter 2 slice, Batch C): validates
    # every registered table's JSON source, cross-table references, the
    # whole-bundle chapter manifest, and committed inventory drift. Pure
    # Python/stdlib, no generated C is linked here -- runs once, before the
    # target-ROM linker gate below, so a stale/inconsistent data source
    # fails fast with actionable file:line diagnostics instead of being
    # masked by (or confused with) a much slower linker failure.
    - name: Check generated-data tables for drift
      run: |
        make generated-data-test
        make generated-data-check

    # The linker gate builds the full modern object/ELF/ROM chain, checks
    # deterministic memory budgets, rejects orphan/overflow/cross-overlay
    # errors, and verifies normal plus shifted boot/title behavior, plus
    # (issue #13) debugtools/new-game/save-format/suspend-resume runtime
    # scenarios and the relocation/raw-pointer/offset audits -- all reusing
    # this same modern object/ELF build for both configs rather than
    # rebuilding per check. This is the default-cap lane; the expanded-cap
    # issue #10 item-ID-expansion gate below is the final target-ROM step.
    - name: Build and verify modern target ROMs and linker
      run: |
        make expansion-modern-linker-check MODERN_CONFIG=debug MODERN_ABI=aapcs -j2
        make expansion-modern-linker-check MODERN_CONFIG=release MODERN_ABI=aapcs -j2

    # Issue #10 acceptance ("Boundary, serialization, and migration tests
    # gate CI"): runs the real, booted expansion ROM's item-ID-expansion
    # runtime probe (expansion-modern-itemexpansion-check, modern.mk) at an
    # expanded item cap (0xCE) for both configurations, immediately after
    # the default-cap linker-check step above and against the exact same
    # MODERN_OUTPUT_DIR it just populated. This is additive only: it does
    # not modify, reorder, or relax the linker-check step above, and it does
    # not touch any committed fingerprint/baseline.
    #
    # Issue #6 (Sprint 2) rides this SAME step and this SAME ROM build: the
    # EXPANSION_STARTER_CONTENT=1 EXPANSION_MECHANICS_HOOKS=1
    # EXPANSION_MECHANICS_SAMPLE=1 profile links the bundled generated-data
    # content example, so the one probe run additionally asserts the authored
    # item record (original name/description/uses/type/attributes/icon) and
    # the content mechanic registered through the public hook registry. No
    # extra workflow command and no extra ROM build.
    #
    # Why this is not stale: every modern C/data object depends on
    # modern.mk's content-addressed MODERN_COMPILE_SETTINGS stamp (which
    # embeds FE8_ITEM_ID_CAP/FE8_EXPANSION_ITEMTEST), so flipping those
    # variables here invalidates and rebuilds exactly the objects the new
    # cap affects instead of silently reusing the previous, default-cap
    # linker-check step's ELF/ROM. Running this bare (no env, plain
    # expansion-modern-linker-check) is deliberately kept a hard failure --
    # this step supplies the required FE8_ITEM_ID_CAP=0xCE
    # FE8_EXPANSION_ITEMTEST=1 pair itself, matching the actionable error
    # expansion-modern-itemexpansion-check prints when they are missing.
    #
    # This is the workflow's final untrusted correctness gate. Pull-request
    # runs receive no base-image secret and publish no artifact.
    - name: Boundary/serialization item-ID-expansion + content runtime gate (cap 0xCE)
      run: |
        FE8_ITEM_ID_CAP=0xCE FE8_EXPANSION_ITEMTEST=1 make expansion-modern-itemexpansion-check MODERN_CONFIG=debug   MODERN_ABI=aapcs EXPANSION_STARTER_CONTENT=1 EXPANSION_MECHANICS_HOOKS=1 EXPANSION_MECHANICS_SAMPLE=1 -j2
        FE8_ITEM_ID_CAP=0xCE FE8_EXPANSION_ITEMTEST=1 make expansion-modern-itemexpansion-check MODERN_CONFIG=release MODERN_ABI=aapcs EXPANSION_STARTER_CONTENT=1 EXPANSION_MECHANICS_HOOKS=1 EXPANSION_MECHANICS_SAMPLE=1 -j2

    - name: Build and verify all-locales/all-features map menu (issues #49/#168)
      run: make expansion-modern-map-menu-presentation-check -j1

  # This lane holds unique broader host evidence for both candidate and
  # post-merge Build runs. It is independent of host-tests and build.
  extended-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_BUILD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Verify checked-out revision
      run: |
        ACTUAL_SHA="$(git rev-parse HEAD)"
        printf 'checkout.sha=%s\n' "$ACTUAL_SHA"
        test "$ACTUAL_SHA" = "$EXPECTED_BUILD_SHA"

    - name: Install extended host dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Run CJK font gates
      run: make -f cjk_fonts.mk cjk-fonts-check cjk-fonts-test

    - name: Run multilang texttools codec gates
      run: python3 -m unittest discover -s scripts/texttools/tests -p 'test_multilang_codec*.py' -v

    - name: Run configuration and linker-budget gates
      run: |
        python3 -m unittest discover -s scripts/modernize/tests -p 'test_expansion_config.py' -v
        python3 -m unittest discover -s scripts/linker_report/tests -p 'test_*.py' -v

  # The archival lane is a combined-gate member for both candidate and master
  # runs, parallel with the supported modern jobs.
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_BUILD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      AGBCC_COMMIT: da598c1d918402c42c0c0d7128ba14567f3175e9
      MGFEMBP_AGBCC_COMMIT: 63b22f3eb8a8051af30bd80c4795b355e439e7ef

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Verify checked-out revision
      run: |
        ACTUAL_SHA="$(git rev-parse HEAD)"
        printf 'checkout.sha=%s\n' "$ACTUAL_SHA"
        test "$ACTUAL_SHA" = "$EXPECTED_BUILD_SHA"

    - name: Install archival build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev pkg-config python3-pip python3-numpy python3-pil

    - name: Preflight archival toolchain executables
      run: |
        set -euo pipefail
        command -v arm-none-eabi-cpp >/dev/null 2>&1
        command -v arm-none-eabi-as >/dev/null 2>&1
        command -v arm-none-eabi-ld >/dev/null 2>&1
        command -v arm-none-eabi-objcopy >/dev/null 2>&1

    - name: Install pinned archival agbcc compilers
      run: |
        set -euo pipefail

        rm -rf .deps/agbcc-ci "$RUNNER_TEMP/mgfembp-agbcc-ci"
        git init --quiet .deps/agbcc-ci
        git -C .deps/agbcc-ci remote add origin https://github.com/pret/agbcc.git
        git -C .deps/agbcc-ci fetch --quiet --depth=1 origin "$AGBCC_COMMIT"
        git -C .deps/agbcc-ci checkout --quiet --detach FETCH_HEAD
        test "$(git -C .deps/agbcc-ci rev-parse HEAD)" = "$AGBCC_COMMIT"
        (
          cd .deps/agbcc-ci
          ./build.sh
          ./install.sh "$GITHUB_WORKSPACE"
        )

        git init --quiet "$RUNNER_TEMP/mgfembp-agbcc-ci"
        git -C "$RUNNER_TEMP/mgfembp-agbcc-ci" remote add origin https://github.com/StanHash/agbcc.git
        git -C "$RUNNER_TEMP/mgfembp-agbcc-ci" fetch --quiet --depth=1 origin "$MGFEMBP_AGBCC_COMMIT"
        git -C "$RUNNER_TEMP/mgfembp-agbcc-ci" checkout --quiet --detach FETCH_HEAD
        test "$(git -C "$RUNNER_TEMP/mgfembp-agbcc-ci" rev-parse HEAD)" = "$MGFEMBP_AGBCC_COMMIT"
        (
          cd "$RUNNER_TEMP/mgfembp-agbcc-ci"
          ./build.sh
          ./install.sh "$GITHUB_WORKSPACE/mgfembp"
        )

    - name: Build tools
      run: ./build_tools.sh

    - name: Build archival lane without a copyrighted baserom
      run: |
        set -euo pipefail
        test ! -e baserom.gba
        make legacy -j2
        test ! -e baserom.gba

    - name: Validate pinned archival payload identities
      run: make -C mgfembp compare

  # This separate job is the sole publisher. Its event guard excludes pull
  # requests before secrets are materialized; it consumes BASEROM_URL only
  # through curl's environment expansion and never prints or persists it. It
  # is independent of other master jobs so summary is the only graph join.
  patch-release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PATCH_COMMIT: ${{ github.sha }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        submodules: recursive
        persist-credentials: false

    - run: |
        sudo apt-get update
        sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev pkg-config gcc-arm-none-eabi libnewlib-arm-none-eabi libmgba-dev
        python3 -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/requirements/build.txt

    - run: ./build_tools.sh

    - run: make expansion-modern-all-locales-all-features-check -j1

    - run: |
        set -euo pipefail
        test -n "$BASEROM_URL"
        base_image="$RUNNER_TEMP/base-image"
        target_image="$RUNNER_TEMP/target-image"
        cp build/expansion-modern-all-locales-all-features/release/aapcs/fireemblem8.gba "$target_image"
        trap 'rm -f "$base_image" "$target_image"' EXIT
        curl --fail --silent --location --proto '=https' --proto-redir '=https' --tlsv1.2 --output "$base_image" "$BASEROM_URL"
        python3 -m scripts.modernize.patch_release create --base "$base_image" --target "$target_image" --metadata build/expansion-modern-all-locales-all-features/release/aapcs/generated/expansion_build_metadata.json --output-dir "$PATCH_ARTIFACT_DIR" --commit "$PATCH_COMMIT"
        python3 -m scripts.modernize.patch_release verify --base "$base_image" --artifact-dir "$PATCH_ARTIFACT_DIR"
        LC_ALL=C
        export LC_ALL
        find "$PATCH_ARTIFACT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort | diff -u <(printf '%s\n' README.txt fireemblem8-expansion-all-locales-all-features-aapcs.bps manifest.json | sort) -
      env:
        BASEROM_URL: ${{ secrets.BASEROM_URL }}
        PATCH_ARTIFACT_DIR: ${{ runner.temp }}/patch-artifact

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
      with:
        name: modern-release-all-locales-all-features-aapcs-bps-${{ github.sha }}
        path: ${{ runner.temp }}/patch-artifact
        if-no-files-found: error
        retention-days: 30

  summary:
    if: always()
    needs: [host-tests, build, extended-host-tests, legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST_TESTS_RESULT: ${{ needs.host-tests.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      EXTENDED_HOST_TESTS_RESULT: ${{ needs.extended-host-tests.result }}
      LEGACY_RESULT: ${{ needs.legacy.result }}

    steps:
    - name: Render fail-closed combined Build summary
      run: |
        {
          echo "## Combined Build CI"
          echo
          echo "| Job | Conclusion |"
          echo "| --- | --- |"
          echo "| host-tests | $HOST_TESTS_RESULT |"
          echo "| build | $BUILD_RESULT |"
          echo "| extended-host-tests | $EXTENDED_HOST_TESTS_RESULT |"
          echo "| legacy | $LEGACY_RESULT |"
        } >> "$GITHUB_STEP_SUMMARY"

        for result in "$HOST_TESTS_RESULT" "$BUILD_RESULT" "$EXTENDED_HOST_TESTS_RESULT" \
          "$LEGACY_RESULT"
        do
          if [ "$result" != "success" ]; then
            echo "required combined Build CI job did not succeed: $result" >&2
            exit 1
          fi
        done
