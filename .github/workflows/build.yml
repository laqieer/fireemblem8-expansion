    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
      with:
        name: modern-release-all-locales-all-features-aapcs-bps-${{ needs.event-identity.outputs.fallback_sha }}
        path: ${{ runner.temp }}/patch-artifact
        if-no-files-found: error
        retention-days: 30

  # Live branch protection currently keeps canonical `host-tests`, `build`,
  # and `summary` required. Metadata-only edits therefore use successful
  # trusted `host-tests`/`build` continuity adapters, keep `extended-host-tests`
  # and `legacy` platform-skipped, and emit canonical `summary` only after a
  # trusted no-checkout API proof confirms one prior successful complete full
  # Build CI run for the same exact PR/base/head identity.
  summary:
    name: summary
    if: always()
    needs: [event-identity, event-classifier, host-tests, build, extended-host-tests, legacy, patch-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLASSIFIER_RESULT: ${{ needs.event-classifier.result }}
      CLASSIFICATION: ${{ needs.event-classifier.outputs.classification }}
      CLASSIFIED_BASE_SHA: ${{ needs.event-classifier.outputs.expected_base }}
      CLASSIFIED_BUILD_SHA: ${{ needs.event-classifier.outputs.expected_head }}
      FALLBACK_IDENTITY_RESULT: ${{ needs.event-identity.result }}
      FALLBACK_KIND: ${{ needs.event-identity.outputs.fallback_kind }}
      FALLBACK_SHA: ${{ needs.event-identity.outputs.fallback_sha }}
      FULL_FALLBACK: ${{ needs.event-classifier.outputs.full_fallback }}
      HEAD_VALID: ${{ needs.event-classifier.outputs.head_valid }}
      IDENTITY_VALID: ${{ needs.event-classifier.outputs.identity_valid }}
      RUN_EXPENSIVE: ${{ needs.event-classifier.outputs.run_expensive }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PUSH_SHA: ${{ github.event.after }}
      RAW_PUSH_SHA: ${{ github.sha }}
      HOST_TESTS_RESULT: ${{ needs.host-tests.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      EXTENDED_HOST_TESTS_RESULT: ${{ needs.extended-host-tests.result }}
      LEGACY_RESULT: ${{ needs.legacy.result }}
      PATCH_RELEASE_RESULT: ${{ needs.patch-release.result }}
      GITHUB_API_URL: ${{ github.api_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.number }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      RUN_ID: ${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}

    steps:
    - name: Render fail-closed combined Build summary
      run: |
        {
          echo "## Combined Build CI"
          echo
          echo "| Job | Conclusion |"
          echo "| --- | --- |"
          echo "| event-identity | $FALLBACK_IDENTITY_RESULT ($FALLBACK_KIND) |"
          echo "| event-classifier | $CLASSIFIER_RESULT ($CLASSIFICATION) |"
          echo "| host-tests | $HOST_TESTS_RESULT |"
          echo "| build | $BUILD_RESULT |"
          echo "| extended-host-tests | $EXTENDED_HOST_TESTS_RESULT |"
          echo "| legacy | $LEGACY_RESULT |"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$CLASSIFIER_RESULT" = "failure" ]; then
          if [ "$FALLBACK_IDENTITY_RESULT" = "success" ] && \
             [ "$GITHUB_EVENT_NAME" = "pull_request" ] && \
             [ "$FALLBACK_KIND" = "pull_request" ] && \
             [ "$FALLBACK_SHA" = "$PR_HEAD_SHA" ]; then
            for result in "$HOST_TESTS_RESULT" "$BUILD_RESULT" \
              "$EXTENDED_HOST_TESTS_RESULT" "$LEGACY_RESULT"
            do
              if [ "$result" != "success" ]; then
                echo "classifier-fallback Build worker did not succeed: $result" >&2
                exit 1
              fi
            done
            if [ "$PATCH_RELEASE_RESULT" != "skipped" ]; then
              echo "classifier-fallback PR unexpectedly ran publisher: $PATCH_RELEASE_RESULT" >&2
              exit 1
            fi
            echo "Build event classifier failed after exact-head fallback workers completed" >&2
            exit 1
          fi
          if [ "$FALLBACK_IDENTITY_RESULT" = "success" ] && \
