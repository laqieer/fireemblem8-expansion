        def main():
          import decimal
          import json
          import math
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          MAX_API_URL_BYTES = 512
          MAX_FLOAT_LITERAL_BYTES = 128
          MAX_HEADER_BYTES = 8192
          MAX_JSON_BYTES = 4194304
          MAX_PAGE_SIZE = 100
          MAX_PR_NUMBER_BYTES = 20
          MAX_REPOSITORY_BYTES = 256
          MAX_RUN_PAGES = 10
          MAX_SEQUENCE_VALUE = 999999999999999999
          MAX_TOTAL_RUNS = MAX_PAGE_SIZE * MAX_RUN_PAGES
          MAX_TOKEN_BYTES = 8192
          INT_RE = re.compile(r"^[1-9][0-9]{0,18}$")
          REPO_RE = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")
          SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          TIMESTAMP_RE = re.compile(r"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")
          WORKFLOW_FILENAME = "build.yml"
          WORKFLOW_PATH_PREFIX = ".github/workflows/build.yml"
          FULL_JOB_NAMES = frozenset(
              {
                  "event-identity",
                  "event-router",
                  "event-classifier",
                  "host-tests",
                  "build",
                  "extended-host-tests",
                  "legacy",
                  "patch-release",
                  "summary",
