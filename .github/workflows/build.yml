name: Build CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  # Validate raw event identities before any checkout. This job executes only
  # the trusted workflow shell: it never reads or runs candidate-controlled
  # repository content.
  event-identity:
    name: event-identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classifier_expected_sha: ${{ steps.identity.outputs.classifier_expected_sha }}
      classifier_ref: ${{ steps.identity.outputs.classifier_ref }}
      fallback_kind: ${{ steps.identity.outputs.fallback_kind }}
      fallback_sha: ${{ steps.identity.outputs.fallback_sha }}
    env:
      BASH_ENV: ''
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      ENV: ''
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      PATH: /usr/bin:/bin
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_SHA_JSON: ${{ toJSON(github.event.pull_request.base.sha) }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_SHA_JSON: ${{ toJSON(github.event.pull_request.head.sha) }}
      PR_NUMBER: ${{ github.event.number }}
      PR_NUMBER_JSON: ${{ toJSON(github.event.number) }}
      PUSH_SHA: ${{ github.event.after }}
      PUSH_SHA_JSON: ${{ toJSON(github.event.after) }}
      RAW_SHA: ${{ github.sha }}
      RAW_SHA_JSON: ${{ toJSON(github.sha) }}

    steps:
    - name: Validate trusted event identities
      id: identity
      run: |
        is_lower_sha() {
          [[ "$1" =~ ^[0-9a-f]{40}$ && "$2" = "\"$1\"" ]]
        }
        is_pr_number() {
          [[ "$1" =~ ^[1-9][0-9]*$ && "$2" = "$1" ]]
        }

        classifier_expected_sha=""
        classifier_ref="refs/heads/$DEFAULT_BRANCH"
        fallback_kind="none"
        fallback_sha=""
        /usr/bin/git check-ref-format "$classifier_ref"

        if [[ "$EVENT_NAME" = "pull_request" ]]; then
          if is_lower_sha "$PR_BASE_SHA" "$PR_BASE_SHA_JSON"; then
            classifier_expected_sha="$PR_BASE_SHA"
            classifier_ref="$PR_BASE_SHA"
          fi
          if is_pr_number "$PR_NUMBER" "$PR_NUMBER_JSON" && \
             [[ "$EVENT_REF" = "refs/pull/$PR_NUMBER/merge" ]] && \
             is_lower_sha "$PR_HEAD_SHA" "$PR_HEAD_SHA_JSON"; then
            fallback_kind="pull_request"
            fallback_sha="$PR_HEAD_SHA"
          fi
        elif [[ "$EVENT_NAME" = "push" && "$EVENT_REF" = "refs/heads/master" ]] && \
             is_lower_sha "$PUSH_SHA" "$PUSH_SHA_JSON" && \
             is_lower_sha "$RAW_SHA" "$RAW_SHA_JSON" && \
             [[ "$RAW_SHA" = "$PUSH_SHA" ]]; then
          classifier_expected_sha="$PUSH_SHA"
          classifier_ref="$PUSH_SHA"
          fallback_kind="push"
          fallback_sha="$PUSH_SHA"
        fi

        {
          echo "classifier_expected_sha=$classifier_expected_sha"
          echo "classifier_ref=$classifier_ref"
          echo "fallback_kind=$fallback_kind"
          echo "fallback_sha=$fallback_sha"
        } >> "$GITHUB_OUTPUT"

  # Event payloads are classified from the current integration base, never
  # from mutable PR-head code. A branch whose base predates the classifier
  # takes the bootstrap full-build path. Classifier failure with a separately
  # validated event-specific PR head or guarded master-push SHA runs every
  # worker at that exact SHA, then fails summary; without one it runs none.
  # Missing/stale successful output never selects a fallback ref. Unknown,
  # mixed, and incomplete change records with complete identity select the
  # expensive graph.
  event-router:
    name: event-router
    if: ${{ always() && needs.event-identity.result == 'success' }}
    needs: [event-identity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
      expected_base: ${{ steps.classify.outputs.expected_base }}
      expected_head: ${{ steps.classify.outputs.expected_head }}
      full_fallback: ${{ steps.classify.outputs.full_fallback }}
      head_valid: ${{ steps.classify.outputs.head_valid }}
      identity_valid: ${{ steps.classify.outputs.identity_valid }}
      reason: ${{ steps.classify.outputs.reason }}
      run_expensive: ${{ steps.classify.outputs.run_expensive }}
    env:
      CLASSIFIER_EXPECTED_SHA: ${{ needs.event-identity.outputs.classifier_expected_sha }}
      CLASSIFIER_REF: ${{ needs.event-identity.outputs.classifier_ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_BASE_REF_JSON: ${{ toJSON(github.event.pull_request.base.ref) }}
      PR_BASE_SHA_JSON: ${{ toJSON(github.event.pull_request.base.sha) }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PUSH_SHA: ${{ github.event.after }}
      VALIDATED_FALLBACK_KIND: ${{ needs.event-identity.outputs.fallback_kind }}
      VALIDATED_FALLBACK_SHA: ${{ needs.event-identity.outputs.fallback_sha }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.event-identity.outputs.classifier_ref }}
        fetch-depth: 1
        persist-credentials: false

    - name: Verify classifier authority revision
      run: |
        ACTUAL_SHA="$(git rev-parse HEAD)"
        printf 'classifier.sha=%s\n' "$ACTUAL_SHA"
        if [ -n "$CLASSIFIER_EXPECTED_SHA" ]; then
          test "$ACTUAL_SHA" = "$CLASSIFIER_EXPECTED_SHA"
        else
          test "$CLASSIFIER_REF" = "refs/heads/$DEFAULT_BRANCH"
        fi

    - name: Classify Build event
      id: classify
      env:
        BASH_ENV: ''
        ENV: ''
        GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
        GIT_CEILING_DIRECTORIES: ''
        GIT_COMMON_DIR: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_KEY_0: ''
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_PARAMETERS: ''
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_VALUE_0: ''
        GIT_DIR: ''
        GIT_EXEC_PATH: ''
        GIT_INDEX_FILE: ''
        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_OBJECT_DIRECTORY: ''
        GIT_REPLACE_REF_BASE: ''
        GIT_WORK_TREE: ''
        PATH: /usr/bin:/bin
        PYTHONPATH: ''
      run: |
        if test -f scripts/workflow_pilot/event_classifier.py; then
          /usr/bin/python3 -I scripts/workflow_pilot/isolated_launcher.py classify-event \
            --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" \
            --github-ref "$GITHUB_REF" --github-sha "$GITHUB_SHA" \
            --pr-base-sha "$PR_BASE_SHA" --pr-head-sha "$PR_HEAD_SHA" \
            --push-sha "$PUSH_SHA" --output "$GITHUB_OUTPUT"
        else
          base_ref_valid=false
          expected_base=""
          expected_head=""
          full_fallback=false
          head_valid=false
          identity_valid=false
          if [[ "$GITHUB_EVENT_NAME" = "pull_request" ]]; then
            LC_ALL=C
            export LC_ALL
            if [[ "$PR_BASE_REF" != "@" && "$PR_BASE_REF_JSON" = \"*\" && \
                  ${#PR_BASE_REF} -le 1024 ]] && \
               /usr/bin/git check-ref-format "refs/heads/$PR_BASE_REF" \
                 > /dev/null 2>&1; then
              base_ref_valid=true
            fi
            if [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ && \
                  "$PR_BASE_SHA_JSON" = "\"$PR_BASE_SHA\"" ]]; then
              expected_base="$PR_BASE_SHA"
            fi
            if [[ "$VALIDATED_FALLBACK_KIND" = "pull_request" && \
                  "$VALIDATED_FALLBACK_SHA" = "$PR_HEAD_SHA" ]]; then
              expected_head="$VALIDATED_FALLBACK_SHA"
              head_valid=true
            fi
            if [[ -n "$expected_base" && -n "$expected_head" && \
                  "$base_ref_valid" = true ]]; then
              identity_valid=true
            elif [[ "$head_valid" = true ]]; then
              full_fallback=true
            fi
          elif [[ "$VALIDATED_FALLBACK_KIND" = "push" && \
                  "$VALIDATED_FALLBACK_SHA" = "$PUSH_SHA" ]]; then
            expected_head="$VALIDATED_FALLBACK_SHA"
            head_valid=true
            identity_valid=true
          fi
          {
            echo "classification=full"
            echo "reason=classifier-bootstrap"
            echo "expected_base=$expected_base"
            echo "expected_head=$expected_head"
            echo "full_fallback=$full_fallback"
            echo "head_valid=$head_valid"
            echo "identity_valid=$identity_valid"
            echo "run_expensive=true"
          } >> "$GITHUB_OUTPUT"
        fi

  event-classifier:
    name: ${{ needs.event-router.result == 'success' && needs.event-router.outputs.classification == 'metadata-only' && 'metadata-classifier' || 'event-classifier' }}
    if: always()
    needs: [event-identity, event-router]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      classification: ${{ needs.event-router.outputs.classification }}
      expected_base: ${{ needs.event-router.outputs.expected_base }}
      expected_head: ${{ needs.event-router.outputs.expected_head }}
      full_fallback: ${{ needs.event-router.outputs.full_fallback }}
      head_valid: ${{ needs.event-router.outputs.head_valid }}
      identity_valid: ${{ needs.event-router.outputs.identity_valid }}
      reason: ${{ needs.event-router.outputs.reason }}
      run_expensive: ${{ needs.event-router.outputs.run_expensive }}
    env:
      CLASSIFICATION: ${{ needs.event-router.outputs.classification }}
      CLASSIFIED_HEAD: ${{ needs.event-router.outputs.expected_head }}
      EVENT_IDENTITY_RESULT: ${{ needs.event-identity.result }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SHA: ${{ github.sha }}
      FULL_FALLBACK: ${{ needs.event-router.outputs.full_fallback }}
      HEAD_VALID: ${{ needs.event-router.outputs.head_valid }}
      IDENTITY_VALID: ${{ needs.event-router.outputs.identity_valid }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ROUTER_RESULT: ${{ needs.event-router.result }}
      RUN_EXPENSIVE: ${{ needs.event-router.outputs.run_expensive }}
      TRUSTED_EVENT_KIND: ${{ needs.event-identity.outputs.fallback_kind }}
      TRUSTED_EVENT_SHA: ${{ needs.event-identity.outputs.fallback_sha }}
      PUSH_SHA: ${{ github.event.after }}

    steps:
    - name: Verify authoritative Build event mode
      run: |
        if [ "$ROUTER_RESULT" != "success" ]; then
          echo "Build event router did not succeed: $ROUTER_RESULT" >&2
          exit 1
        fi
        if [ "$EVENT_IDENTITY_RESULT" != "success" ]; then
          echo "trusted Build event identity did not succeed: $EVENT_IDENTITY_RESULT" >&2
          exit 1
        fi
        if [ "$EVENT_NAME" = "pull_request" ]; then
          if [ "$TRUSTED_EVENT_KIND" != "pull_request" ] || \
             [ -z "$TRUSTED_EVENT_SHA" ] || \
             [ "$TRUSTED_EVENT_SHA" != "$PR_HEAD_SHA" ] || \
             [ "$TRUSTED_EVENT_SHA" != "$CLASSIFIED_HEAD" ]; then
            echo "classified PR head lacks coherent trusted event identity" >&2
            exit 1
          fi
        elif [ "$EVENT_NAME" = "push" ]; then
          if [ "$TRUSTED_EVENT_KIND" != "push" ] || \
             [ -z "$TRUSTED_EVENT_SHA" ] || \
             [ "$TRUSTED_EVENT_SHA" != "$PUSH_SHA" ] || \
             [ "$TRUSTED_EVENT_SHA" != "$EVENT_SHA" ] || \
             [ "$TRUSTED_EVENT_SHA" != "$CLASSIFIED_HEAD" ]; then
            echo "classified push head lacks coherent trusted event identity" >&2
            exit 1
          fi
        else
          echo "classified event has no trusted identity mode" >&2
          exit 1
        fi
        case "$HEAD_VALID" in
          true|false) ;;
          *) echo "Build event router returned invalid head validity" >&2; exit 1 ;;
        esac
        case "$FULL_FALLBACK" in
          true|false) ;;
          *) echo "Build event router returned invalid full fallback" >&2; exit 1 ;;
        esac
        case "$IDENTITY_VALID" in
          true|false) ;;
          *) echo "Build event router returned invalid identity validity" >&2; exit 1 ;;
        esac
        if [ "$CLASSIFICATION" = "metadata-only" ]; then
          if [ "$FULL_FALLBACK" != "false" ] || [ "$HEAD_VALID" != "true" ] || \
             [ "$IDENTITY_VALID" != "true" ] || \
             [ "$RUN_EXPENSIVE" != "false" ]; then
            echo "metadata event mode is not authoritative" >&2
            exit 1
          fi
          exit 0
        fi
        if [ "$CLASSIFICATION" != "full" ] || [ "$RUN_EXPENSIVE" != "true" ]; then
          echo "full Build event mode is not authoritative" >&2
          exit 1
        fi
        if [ "$FULL_FALLBACK" = "true" ] && \
           { [ "$HEAD_VALID" != "true" ] || [ "$IDENTITY_VALID" != "false" ]; }; then
          echo "full fallback mode is not authoritative" >&2
          exit 1
        fi

  # Fast, host-only lane (issues #13 + #12/#15): exercises every
  # tools/gba-playtest host test -- scenario/schema parsing, generators,
  # config, save/migration fixtures, timeouts, retry policy, deterministic
  # sorted-JSON output, and provenance/diagnostics -- and the pure-stdlib
  # upstream-port review tooling suite (tests/upstream_port:
  # classify/scan/drift/state/ref-binding/output-safety/merge-commit and the
  # verify.gates() <-> build.yml mirror), plus the stdlib-only workflow
  # contract suite under tests/workflows and workflow-pilot reporter
  # regression suite. None needs the arm-none-eabi cross-toolchain or a
  # 16 MB ROM build. Only a native C compiler
  # (build-essential) and libmgba-dev are installed, since the one integration
  # test that actually drives libmGBA (test_backend_integration.py) compiles
  # its tiny backend for the *host*, never the GBA target; the upstream-port
  # tests are Python/stdlib only and link no C. This is intentionally a
  # separate job from `build` below so host-only regressions are reported
  # before paying for a full ROM/linker build. The exhaustive full-game
  # localization gate is intentionally measured in minutes. Keep a 60-minute
  # budget: a normal run is roughly 34 minutes including setup, but shared
  # runner variance has reached the former 45-minute ceiling.
  # All host test steps are genuine gates (required status), not advisory.
  host-tests:
    needs: [event-identity, event-classifier]
    if: ${{ always() && ((needs.event-classifier.result == 'success' && needs.event-identity.result == 'success' && needs.event-classifier.outputs.classification == 'full' && needs.event-classifier.outputs.head_valid == 'true' && needs.event-classifier.outputs.run_expensive == 'true' && ((github.event_name == 'pull_request' && needs.event-identity.outputs.fallback_kind == 'pull_request' && needs.event-identity.outputs.fallback_sha == needs.event-classifier.outputs.expected_head && needs.event-classifier.outputs.expected_head == github.event.pull_request.head.sha && github.event.pull_request.head.sha != '' && (needs.event-classifier.outputs.identity_valid == 'true' || needs.event-classifier.outputs.full_fallback == 'true')) || (github.event_name == 'push' && needs.event-identity.outputs.fallback_kind == 'push' && needs.event-identity.outputs.fallback_sha == needs.event-classifier.outputs.expected_head && needs.event-identity.outputs.fallback_sha == github.sha && needs.event-classifier.outputs.identity_valid == 'true' && needs.event-classifier.outputs.expected_head == github.event.after && needs.event-classifier.outputs.expected_base == '' && github.event.after != ''))) || (needs.event-classifier.result == 'failure' && needs.event-identity.result == 'success' && ((github.event_name == 'pull_request' && needs.event-identity.outputs.fallback_kind == 'pull_request' && needs.event-identity.outputs.fallback_sha == github.event.pull_request.head.sha) || (github.event_name == 'push' && needs.event-identity.outputs.fallback_kind == 'push' && needs.event-identity.outputs.fallback_sha == github.event.after && needs.event-identity.outputs.fallback_sha == github.sha)))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_BUILD_SHA: ${{ (needs.event-classifier.result == 'success' && needs.event-classifier.outputs.expected_head) || (needs.event-classifier.result == 'failure' && needs.event-identity.outputs.fallback_sha) || '' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ (needs.event-classifier.result == 'success' && needs.event-classifier.outputs.expected_head) || (needs.event-classifier.result == 'failure' && needs.event-identity.outputs.fallback_sha) || '' }}
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Verify checked-out revision
      run: |
        ACTUAL_SHA="$(git rev-parse HEAD)"
        printf 'checkout.sha=%s\n' "$ACTUAL_SHA"
        test "$ACTUAL_SHA" = "$EXPECTED_BUILD_SHA"

    # Exact-ref checkout can omit force-pushed historical fixture commits.
    # The CI-only helper derives exact object IDs from the committed fixture,
    # fetches only missing commits without refs/tags/eager blobs, and proves
    # both refs and the candidate checkout remain unchanged.
    - name: Hydrate workflow-pilot Git authority
      env:
        BASH_ENV: ''
        ENV: ''
        GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
        GIT_CEILING_DIRECTORIES: ''
        GIT_COMMON_DIR: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_KEY_0: ''
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_PARAMETERS: ''
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_VALUE_0: ''
        GIT_DIR: ''
        GIT_EXEC_PATH: ''
        GIT_INDEX_FILE: ''
        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_OBJECT_DIRECTORY: ''
        GIT_REPLACE_REF_BASE: ''
        GIT_WORK_TREE: ''
        PATH: /usr/bin:/bin
        PYTHONPATH: ''
      run: /usr/bin/python3 -I scripts/workflow_pilot/isolated_launcher.py hydrate --repository-root "$GITHUB_WORKSPACE" --fixture scripts/workflow_pilot/tests/fixtures/baseline.json --decisions .github/workflow-pilot-decisions.json --expected-head "$EXPECTED_BUILD_SHA"

    - name: Install host-only dependencies (no arm-none-eabi toolchain)
      run: sudo apt-get update && sudo apt-get install -y build-essential libmgba-dev

    # GBA_PLAYTEST_HOST_ONLY=1 is the single public switch that makes this a
    # genuinely host-only lane (tools/gba-playtest/tests/host_mode.py): every
    # ROM-dependent live-integration test skips explicitly, before it touches
    # any ROM/ELF/save artifact, instead of deciding live-vs-skip from whether
    # a git-ignored build artifact happens to exist. A clean CI checkout has
    # no ROM, so this job behaves identically here either way; the flag makes
    # that guarantee explicit and reproducible in a local worktree (and under
    # `python3 -m scripts.upstream_port verify --jobs 2`, where the ROM
    # `build` gates below rewrite exactly those artifacts while this gate
    # runs). The live/runtime coverage is owned by the `build` job below --
    # it is not weakened here. The env is inline on this one step only: the
    # `build` job must NOT inherit it, or its runtime gates would skip.
    - name: Run gba-playtest host test suite
      run: GBA_PLAYTEST_HOST_ONLY=1 python3 -m unittest discover -s tools/gba-playtest/tests -v

    # Issue #12/#15 upstream-port review tooling (scripts/upstream_port):
    # pure-stdlib unittest coverage for
    # classify/scan/drift/state/
    # ref-binding/output-safety/merge-commit determinism and, crucially, the
    # verify.gates() <-> this-workflow argv/order mirror. Runs here in the
    # host lane (no arm-none-eabi toolchain, no ROM/linker rebuild) as an
    # explicit required gate; scripts/upstream_port/verify.py re-states these
    # same gate commands, argv-identical and in order, so `verify` reproduces
    # this CI locally without a runner.
    - name: Run upstream-port tooling test suite
      run: python3 -m unittest discover -s tests/upstream_port -v

    # Consolidated Build CI topology contract: candidate/master triggers,
    # combined workers, evidence ownership, and fail-closed summary. Pure
    # stdlib/YAML-text parsing; no ROM/toolchain.
    - name: Run workflow contract test suite
      run: python3 -m unittest discover -s tests/workflows -p "test_*.py" -v

    - name: Run workflow-pilot reporter regression suite (issue #176)
      env:
        BASH_ENV: ''
        ENV: ''
        GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
        GIT_CEILING_DIRECTORIES: ''
        GIT_COMMON_DIR: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_KEY_0: ''
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_PARAMETERS: ''
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_VALUE_0: ''
        GIT_DIR: ''
        GIT_EXEC_PATH: ''
        GIT_INDEX_FILE: ''
        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_OBJECT_DIRECTORY: ''
        GIT_REPLACE_REF_BASE: ''
        GIT_WORK_TREE: ''
        PATH: /usr/bin:/bin
        PYTHONPATH: ''
      run: /usr/bin/python3 -I scripts/workflow_pilot/isolated_launcher.py reporter-tests

    - name: Validate workflow-pilot baseline against checked-out Git history
      env:
        BASH_ENV: ''
        ENV: ''
        GIT_ALTERNATE_OBJECT_DIRECTORIES: ''
        GIT_CEILING_DIRECTORIES: ''
        GIT_COMMON_DIR: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_KEY_0: ''
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_PARAMETERS: ''
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_CONFIG_VALUE_0: ''
        GIT_DIR: ''
        GIT_EXEC_PATH: ''
        GIT_INDEX_FILE: ''
        GIT_NAMESPACE: ''
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_OBJECT_DIRECTORY: ''
        GIT_REPLACE_REF_BASE: ''
        GIT_WORK_TREE: ''
        PATH: /usr/bin:/bin
        PYTHONPATH: ''
      run: /usr/bin/python3 -I scripts/workflow_pilot/isolated_launcher.py baseline --repository-root "$GITHUB_WORKSPACE" --fixture scripts/workflow_pilot/tests/fixtures/baseline.json --decisions .github/workflow-pilot-decisions.json --expected scripts/workflow_pilot/tests/fixtures/baseline_expected.json > /dev/null

    # Issue #18 host-lane closure fix: the scripts/localization package's
    # own pure-stdlib unit test suite (schema/pseudo/catalog/generate/CLI/
    # determinism, plus the host-native resolver-behavior and
    # vanilla-isolation source-audit tests, which self-skip without a host
    # `cc`) -- see localization.mk's `localization-test` target, whose own
    # comment already named it a CI-suitable gate before this step actually
    # wired it in. Python/stdlib only (no arm-none-eabi toolchain, no
    # ROM/linker rebuild), so it stays in this fast host lane; it does not
    # overlap the localization-runtime-*-check scenarios in the `build`
    # job below (those require a real booted ROM and are reached through
    # expansion-modern-linker-check's own dependency list, not this step).
    - name: Run localization host test suite (issue #18)
      run: python3 -m unittest discover -s scripts/localization/tests -p "test_*.py"

    # The full-game payload has a separate source format from the expansion
    # catalog. Its test target includes the typed rendered-width registry,
    # metrics-aware generated-break validation, and native text consumer
    # checks, so an overfull JA/ZH stream cannot pass the default CI lane.
    - name: Run full-game localization width contract (issue #18)
      run: |
        make game-localization-test
        python3 -m scripts.localization.game_locales check
        python3 -m scripts.localization.game_locales check-crosswalk
        python3 -m scripts.localization.game_locales check-raw-closure

  # Ubuntu libmGBA ROM/runtime gate: builds the full modern object/ELF/ROM
  # chain for both supported configs (debug, release; AAPCS only -- see
  # docs/config_identity.md), checks deterministic memory budgets, rejects
  # orphan/overflow/cross-overlay errors, and verifies boot/title/debugtools/
  # new-game/save-format/suspend-resume/shifted-link runtime behavior via
  # the same tools/gba-playtest harness the host-tests job unit-tests in
  # isolation, and finally re-runs that same harness at an expanded item ID
  # cap for the issue #10 item-ID-expansion runtime probe. This is the
  # exact (and only) supported CI host matrix today:
  # ubuntu-latest with arm-none-eabi GCC. macOS (Homebrew) is documented in
  # tools/gba-playtest/README.md for local development but is not exercised
  # by CI. The archival/decomp agbcc `fireemblem8.gba` path is deliberately
  # absent from this modern job; the parallel `legacy` job below owns its
  # archival CI evidence. Per repository policy, this job ends after its
  # target-ROM checks.
  build:
    needs: [event-identity, event-classifier]
    if: ${{ always() && ((needs.event-classifier.result == 'success' && needs.event-identity.result == 'success' && needs.event-classifier.outputs.classification == 'full' && needs.event-classifier.outputs.head_valid == 'true' && needs.event-classifier.outputs.run_expensive == 'true' && ((github.event_name == 'pull_request' && needs.event-identity.outputs.fallback_kind == 'pull_request' && needs.event-identity.outputs.fallback_sha == needs.event-classifier.outputs.expected_head && needs.event-classifier.outputs.expected_head == github.event.pull_request.head.sha && github.event.pull_request.head.sha != '' && (needs.event-classifier.outputs.identity_valid == 'true' || needs.event-classifier.outputs.full_fallback == 'true')) || (github.event_name == 'push' && needs.event-identity.outputs.fallback_kind == 'push' && needs.event-identity.outputs.fallback_sha == needs.event-classifier.outputs.expected_head && needs.event-identity.outputs.fallback_sha == github.sha && needs.event-classifier.outputs.identity_valid == 'true' && needs.event-classifier.outputs.expected_head == github.event.after && needs.event-classifier.outputs.expected_base == '' && github.event.after != ''))) || (needs.event-classifier.result == 'failure' && needs.event-identity.result == 'success' && ((github.event_name == 'pull_request' && needs.event-identity.outputs.fallback_kind == 'pull_request' && needs.event-identity.outputs.fallback_sha == github.event.pull_request.head.sha) || (github.event_name == 'push' && needs.event-identity.outputs.fallback_kind == 'push' && needs.event-identity.outputs.fallback_sha == github.event.after && needs.event-identity.outputs.fallback_sha == github.sha)))) }}
    runs-on: ubuntu-latest
    # A normal debug+release linker/runtime run is roughly 25 minutes, but
    # shared-runner variance has reached the former 30-minute ceiling.
    timeout-minutes: 60
    env:
      EXPECTED_BUILD_SHA: ${{ (needs.event-classifier.result == 'success' && needs.event-classifier.outputs.expected_head) || (needs.event-classifier.result == 'failure' && needs.event-identity.outputs.fallback_sha) || '' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ (needs.event-classifier.result == 'success' && needs.event-classifier.outputs.expected_head) || (needs.event-classifier.result == 'failure' && needs.event-identity.outputs.fallback_sha) || '' }}
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Verify checked-out revision
      run: |
        ACTUAL_SHA="$(git rev-parse HEAD)"
        printf 'checkout.sha=%s\n' "$ACTUAL_SHA"
        test "$ACTUAL_SHA" = "$EXPECTED_BUILD_SHA"

    # Runs against the immutable commit CI is building (not the mutable
    # worktree/index) and before Install dependencies/Build tools create any
    # build output, so a prohibited tracked artifact fails fast on Git object
    # content instead of being masked by later build products.
    - name: Check tracked artifacts
      run: |
        python3 -m unittest discover -s scripts/artifact_guard_tests -p 'test_*.py' -v
        python3 scripts/artifact_guard.py --revision HEAD

    # Issues #7/#17 closure: a fast, stdlib-only, zero-network,
    # zero-ROM documentation governance gate. Runs the checker's own
    # unittest suite, then the checker itself (100% Markdown-inventory
    # exact-coverage, internal link/anchor resolution, external-link
    # registry coverage, stale-command/path denylist, and statically
    # parsed -- never executed -- Makefile-target existence), plus a
    # small hardcoded allowlist of --help-only example commands. Placed
    # immediately after the artifact guard and before dependency
    # install/tool build/ROM linker gates below, so a documentation
    # regression fails in seconds instead of after a multi-minute build.
    - name: Check documentation (issues #7/#17)
      run: |
        python3 -m unittest discover -s scripts/docs_check_tests -v
        python3 scripts/check_docs.py --check --check-examples

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev pkg-config gcc-arm-none-eabi libnewlib-arm-none-eabi libmgba-dev
        python3 -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/requirements/build.txt

    - name: Build tools
      run: ./build_tools.sh

    - name: Run CodeQL alert regression suite (issue #84)
      run: make codeql-alerts-test CODEQL_REQUIRE_FANALYZER=1

    # Issue #15 closure: a bare `make`/`make all` must unconditionally
    # resolve to the modern release AAPCS boot-check chain, with the
    # archival agbcc lane reachable only by explicitly naming `make
    # legacy`/`make fireemblem8.gba` -- never via any environment variable
    # or `make` command-line variable override. These targeted tests are
    # stdlib `unittest` only (no pytest/network installs) and are dry-run/
    # database-probe based against the real Makefile/quickstart.sh (never a
    # real multi-minute compile/link/boot-check), so they run early and
    # fail fast on any structural regression before the slower linker gate
    # below.
    - name: Check default build lane and quickstart legacy glue (issue #15)
      run: |
        python3 -m unittest discover -s scripts/modernize/tests -p "test_build_default_lane.py" -v
        python3 -m unittest discover -s scripts/modernize/tests -p "test_quickstart.py" -v

    # Generated-data platform (Issue #5 Chapter 2 slice, Batch C): validates
    # every registered table's JSON source, cross-table references, the
    # whole-bundle chapter manifest, and committed inventory drift. Pure
    # Python/stdlib, no generated C is linked here -- runs once, before the
    # target-ROM linker gate below, so a stale/inconsistent data source
    # fails fast with actionable file:line diagnostics instead of being
    # masked by (or confused with) a much slower linker failure.
    - name: Check generated-data tables for drift
      run: |
        make generated-data-test
        make generated-data-check

    # The linker gate builds the full modern object/ELF/ROM chain, checks
    # deterministic memory budgets, rejects orphan/overflow/cross-overlay
    # errors, and verifies normal plus shifted boot/title behavior, plus
    # (issue #13) debugtools/new-game/save-format/suspend-resume runtime
    # scenarios and the relocation/raw-pointer/offset audits -- all reusing
    # this same modern object/ELF build for both configs rather than
    # rebuilding per check. This is the default-cap lane; the expanded-cap
    # issue #10 item-ID-expansion gate below is the final target-ROM step.
    - name: Build and verify modern target ROMs and linker
      run: |
        make expansion-modern-linker-check MODERN_CONFIG=debug MODERN_ABI=aapcs -j2
        make expansion-modern-linker-check MODERN_CONFIG=release MODERN_ABI=aapcs -j2

    # Issue #10 acceptance ("Boundary, serialization, and migration tests
    # gate CI"): runs the real, booted expansion ROM's item-ID-expansion
    # runtime probe (expansion-modern-itemexpansion-check, modern.mk) at an
    # expanded item cap (0xCE) for both configurations, immediately after
    # the default-cap linker-check step above and against the exact same
    # MODERN_OUTPUT_DIR it just populated. This is additive only: it does
    # not modify, reorder, or relax the linker-check step above, and it does
    # not touch any committed fingerprint/baseline.
    #
    # Issue #6 (Sprint 2) rides this SAME step and this SAME ROM build: the
    # EXPANSION_STARTER_CONTENT=1 EXPANSION_MECHANICS_HOOKS=1
    # EXPANSION_MECHANICS_SAMPLE=1 profile links the bundled generated-data
    # content example, so the one probe run additionally asserts the authored
    # item record (original name/description/uses/type/attributes/icon) and
    # the content mechanic registered through the public hook registry. No
    # extra workflow command and no extra ROM build.
    #
    # Why this is not stale: every modern C/data object depends on
    # modern.mk's content-addressed MODERN_COMPILE_SETTINGS stamp (which
    # embeds FE8_ITEM_ID_CAP/FE8_EXPANSION_ITEMTEST), so flipping those
    # variables here invalidates and rebuilds exactly the objects the new
    # cap affects instead of silently reusing the previous, default-cap
    # linker-check step's ELF/ROM. Running this bare (no env, plain
    # expansion-modern-linker-check) is deliberately kept a hard failure --
    # this step supplies the required FE8_ITEM_ID_CAP=0xCE
    # FE8_EXPANSION_ITEMTEST=1 pair itself, matching the actionable error
    # expansion-modern-itemexpansion-check prints when they are missing.
    #
    # This is the workflow's final untrusted correctness gate. Pull-request
    # runs receive no base-image secret and publish no artifact.
    - name: Boundary/serialization item-ID-expansion + content runtime gate (cap 0xCE)
      run: |
        FE8_ITEM_ID_CAP=0xCE FE8_EXPANSION_ITEMTEST=1 make expansion-modern-itemexpansion-check MODERN_CONFIG=debug   MODERN_ABI=aapcs EXPANSION_STARTER_CONTENT=1 EXPANSION_MECHANICS_HOOKS=1 EXPANSION_MECHANICS_SAMPLE=1 -j2
        FE8_ITEM_ID_CAP=0xCE FE8_EXPANSION_ITEMTEST=1 make expansion-modern-itemexpansion-check MODERN_CONFIG=release MODERN_ABI=aapcs EXPANSION_STARTER_CONTENT=1 EXPANSION_MECHANICS_HOOKS=1 EXPANSION_MECHANICS_SAMPLE=1 -j2

    - name: Build and verify all-locales/all-features map menu (issues #49/#168)
      run: make expansion-modern-map-menu-presentation-check -j1

  # This lane holds unique broader host evidence for both candidate and
  # post-merge Build runs. It is independent of host-tests and build.
  extended-host-tests:
    needs: [event-identity, event-classifier]
    if: ${{ always() && ((needs.event-classifier.result == 'success' && needs.event-identity.result == 'success' && needs.event-classifier.outputs.classification == 'full' && needs.event-classifier.outputs.head_valid == 'true' && needs.event-classifier.outputs.run_expensive == 'true' && ((github.event_name == 'pull_request' && needs.event-identity.outputs.fallback_kind == 'pull_request' && needs.event-identity.outputs.fallback_sha == needs.event-classifier.outputs.expected_head && needs.event-classifier.outputs.expected_head == github.event.pull_request.head.sha && github.event.pull_request.head.sha != '' && (needs.event-classifier.outputs.identity_valid == 'true' || needs.event-classifier.outputs.full_fallback == 'true')) || (github.event_name == 'push' && needs.event-identity.outputs.fallback_kind == 'push' && needs.event-identity.outputs.fallback_sha == needs.event-classifier.outputs.expected_head && needs.event-identity.outputs.fallback_sha == github.sha && needs.event-classifier.outputs.identity_valid == 'true' && needs.event-classifier.outputs.expected_head == github.event.after && needs.event-classifier.outputs.expected_base == '' && github.event.after != ''))) || (needs.event-classifier.result == 'failure' && needs.event-identity.result == 'success' && ((github.event_name == 'pull_request' && needs.event-identity.outputs.fallback_kind == 'pull_request' && needs.event-identity.outputs.fallback_sha == github.event.pull_request.head.sha) || (github.event_name == 'push' && needs.event-identity.outputs.fallback_kind == 'push' && needs.event-identity.outputs.fallback_sha == github.event.after && needs.event-identity.outputs.fallback_sha == github.sha)))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_BUILD_SHA: ${{ (needs.event-classifier.result == 'success' && needs.event-classifier.outputs.expected_head) || (needs.event-classifier.result == 'failure' && needs.event-identity.outputs.fallback_sha) || '' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ (needs.event-classifier.result == 'success' && needs.event-classifier.outputs.expected_head) || (needs.event-classifier.result == 'failure' && needs.event-identity.outputs.fallback_sha) || '' }}
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Verify checked-out revision
      run: |
        ACTUAL_SHA="$(git rev-parse HEAD)"
        printf 'checkout.sha=%s\n' "$ACTUAL_SHA"
        test "$ACTUAL_SHA" = "$EXPECTED_BUILD_SHA"

    - name: Install extended host dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Run CJK font gates
      run: make -f cjk_fonts.mk cjk-fonts-check cjk-fonts-test

    - name: Run multilang texttools codec gates
      run: python3 -m unittest discover -s scripts/texttools/tests -p 'test_multilang_codec*.py' -v

    - name: Run configuration and linker-budget gates
      run: |
        python3 -m unittest discover -s scripts/modernize/tests -p 'test_expansion_config.py' -v
        python3 -m unittest discover -s scripts/linker_report/tests -p 'test_*.py' -v

  # The archival lane is a combined-gate member for both candidate and master
  # runs, parallel with the supported modern jobs.
  legacy:
    needs: [event-identity, event-classifier]
    if: ${{ always() && ((needs.event-classifier.result == 'success' && needs.event-identity.result == 'success' && needs.event-classifier.outputs.classification == 'full' && needs.event-classifier.outputs.head_valid == 'true' && needs.event-classifier.outputs.run_expensive == 'true' && ((github.event_name == 'pull_request' && needs.event-identity.outputs.fallback_kind == 'pull_request' && needs.event-identity.outputs.fallback_sha == needs.event-classifier.outputs.expected_head && needs.event-classifier.outputs.expected_head == github.event.pull_request.head.sha && github.event.pull_request.head.sha != '' && (needs.event-classifier.outputs.identity_valid == 'true' || needs.event-classifier.outputs.full_fallback == 'true')) || (github.event_name == 'push' && needs.event-identity.outputs.fallback_kind == 'push' && needs.event-identity.outputs.fallback_sha == needs.event-classifier.outputs.expected_head && needs.event-identity.outputs.fallback_sha == github.sha && needs.event-classifier.outputs.identity_valid == 'true' && needs.event-classifier.outputs.expected_head == github.event.after && needs.event-classifier.outputs.expected_base == '' && github.event.after != ''))) || (needs.event-classifier.result == 'failure' && needs.event-identity.result == 'success' && ((github.event_name == 'pull_request' && needs.event-identity.outputs.fallback_kind == 'pull_request' && needs.event-identity.outputs.fallback_sha == github.event.pull_request.head.sha) || (github.event_name == 'push' && needs.event-identity.outputs.fallback_kind == 'push' && needs.event-identity.outputs.fallback_sha == github.event.after && needs.event-identity.outputs.fallback_sha == github.sha)))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_BUILD_SHA: ${{ (needs.event-classifier.result == 'success' && needs.event-classifier.outputs.expected_head) || (needs.event-classifier.result == 'failure' && needs.event-identity.outputs.fallback_sha) || '' }}
      AGBCC_COMMIT: da598c1d918402c42c0c0d7128ba14567f3175e9
      MGFEMBP_AGBCC_COMMIT: 63b22f3eb8a8051af30bd80c4795b355e439e7ef

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ (needs.event-classifier.result == 'success' && needs.event-classifier.outputs.expected_head) || (needs.event-classifier.result == 'failure' && needs.event-identity.outputs.fallback_sha) || '' }}
        fetch-depth: 0
        submodules: recursive
        persist-credentials: false

    - name: Verify checked-out revision
      run: |
        ACTUAL_SHA="$(git rev-parse HEAD)"
        printf 'checkout.sha=%s\n' "$ACTUAL_SHA"
        test "$ACTUAL_SHA" = "$EXPECTED_BUILD_SHA"

    - name: Install archival build dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev pkg-config python3-pip python3-numpy python3-pil

    - name: Preflight archival toolchain executables
      run: |
        set -euo pipefail
        command -v arm-none-eabi-cpp >/dev/null 2>&1
        command -v arm-none-eabi-as >/dev/null 2>&1
        command -v arm-none-eabi-ld >/dev/null 2>&1
        command -v arm-none-eabi-objcopy >/dev/null 2>&1

    - name: Install pinned archival agbcc compilers
      run: |
        set -euo pipefail

        rm -rf .deps/agbcc-ci "$RUNNER_TEMP/mgfembp-agbcc-ci"
        git init --quiet .deps/agbcc-ci
        git -C .deps/agbcc-ci remote add origin https://github.com/pret/agbcc.git
        git -C .deps/agbcc-ci fetch --quiet --depth=1 origin "$AGBCC_COMMIT"
        git -C .deps/agbcc-ci checkout --quiet --detach FETCH_HEAD
        test "$(git -C .deps/agbcc-ci rev-parse HEAD)" = "$AGBCC_COMMIT"
        (
          cd .deps/agbcc-ci
          ./build.sh
          ./install.sh "$GITHUB_WORKSPACE"
        )

        git init --quiet "$RUNNER_TEMP/mgfembp-agbcc-ci"
        git -C "$RUNNER_TEMP/mgfembp-agbcc-ci" remote add origin https://github.com/StanHash/agbcc.git
        git -C "$RUNNER_TEMP/mgfembp-agbcc-ci" fetch --quiet --depth=1 origin "$MGFEMBP_AGBCC_COMMIT"
        git -C "$RUNNER_TEMP/mgfembp-agbcc-ci" checkout --quiet --detach FETCH_HEAD
        test "$(git -C "$RUNNER_TEMP/mgfembp-agbcc-ci" rev-parse HEAD)" = "$MGFEMBP_AGBCC_COMMIT"
        (
          cd "$RUNNER_TEMP/mgfembp-agbcc-ci"
          ./build.sh
          ./install.sh "$GITHUB_WORKSPACE/mgfembp"
        )

    - name: Build tools
      run: ./build_tools.sh

    - name: Build archival lane without a copyrighted baserom
      run: |
        set -euo pipefail
        test ! -e baserom.gba
        make legacy -j2
        test ! -e baserom.gba

    - name: Validate pinned archival payload identities
      run: make -C mgfembp compare

  # This separate job is the sole publisher. Its event guard excludes pull
  # requests before secrets are materialized; it consumes BASEROM_URL only
  # through curl's environment expansion and never prints or persists it. It
  # is independent of other master jobs so summary is the only graph join.
  patch-release:
    needs: [event-identity]
    if: ${{ always() && needs.event-identity.result == 'success' && github.event_name == 'push' && needs.event-identity.outputs.fallback_kind == 'push' && needs.event-identity.outputs.fallback_sha == github.event.after && needs.event-identity.outputs.fallback_sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PATCH_COMMIT: ${{ needs.event-identity.outputs.fallback_sha }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.event-identity.outputs.fallback_sha }}
        submodules: recursive
        persist-credentials: false

    - name: Verify patch candidate revision
      env:
        BASH_ENV: ''
        ENV: ''
        GIT_CONFIG_COUNT: '0'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_SYSTEM: /dev/null
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        PATH: /usr/bin:/bin
      run: |
        ACTUAL_SHA="$(/usr/bin/git rev-parse HEAD)"
        printf 'patch.checkout.sha=%s\n' "$ACTUAL_SHA"
        test "$ACTUAL_SHA" = "$PATCH_COMMIT"

    - name: Download private base image
      env:
        BASH_ENV: ''
        BASEROM_URL: ${{ secrets.BASEROM_URL }}
        ENV: ''
        PATH: /usr/bin:/bin
      run: |
        set -euo pipefail
        test -n "$BASEROM_URL"
        /usr/bin/curl --fail --silent --location --proto '=https' --proto-redir '=https' --tlsv1.2 --output "$RUNNER_TEMP/base-image" "$BASEROM_URL"

    - run: |
        sudo apt-get update
        sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev pkg-config gcc-arm-none-eabi libnewlib-arm-none-eabi libmgba-dev
        python3 -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/requirements/build.txt

    - run: ./build_tools.sh

    - run: make expansion-modern-all-locales-all-features-check -j1

    - name: Create and verify patch artifact
      env:
        PATCH_ARTIFACT_DIR: ${{ runner.temp }}/patch-artifact
      run: |
        set -euo pipefail
        base_image="$RUNNER_TEMP/base-image"
        target_image="$RUNNER_TEMP/target-image"
        cp build/expansion-modern-all-locales-all-features/release/aapcs/fireemblem8.gba "$target_image"
        trap 'rm -f "$base_image" "$target_image"' EXIT
        python3 -m scripts.modernize.patch_release create --base "$base_image" --target "$target_image" --metadata build/expansion-modern-all-locales-all-features/release/aapcs/generated/expansion_build_metadata.json --output-dir "$PATCH_ARTIFACT_DIR" --commit "$PATCH_COMMIT"
        python3 -m scripts.modernize.patch_release verify --base "$base_image" --artifact-dir "$PATCH_ARTIFACT_DIR"
        LC_ALL=C
        export LC_ALL
        find "$PATCH_ARTIFACT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort | diff -u <(printf '%s\n' README.txt fireemblem8-expansion-all-locales-all-features-aapcs.bps manifest.json | sort) -
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
      with:
        name: modern-release-all-locales-all-features-aapcs-bps-${{ needs.event-identity.outputs.fallback_sha }}
        path: ${{ runner.temp }}/patch-artifact
        if-no-files-found: error
        retention-days: 30

  summary:
    name: ${{ needs.event-classifier.result == 'success' && needs.event-classifier.outputs.classification == 'metadata-only' && 'metadata-summary' || 'summary' }}
    if: always()
    needs: [event-identity, event-classifier, host-tests, build, extended-host-tests, legacy, patch-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLASSIFIER_RESULT: ${{ needs.event-classifier.result }}
      CLASSIFICATION: ${{ needs.event-classifier.outputs.classification }}
      CLASSIFIED_BASE_SHA: ${{ needs.event-classifier.outputs.expected_base }}
      CLASSIFIED_BUILD_SHA: ${{ needs.event-classifier.outputs.expected_head }}
      FALLBACK_IDENTITY_RESULT: ${{ needs.event-identity.result }}
      FALLBACK_KIND: ${{ needs.event-identity.outputs.fallback_kind }}
      FALLBACK_SHA: ${{ needs.event-identity.outputs.fallback_sha }}
      FULL_FALLBACK: ${{ needs.event-classifier.outputs.full_fallback }}
      HEAD_VALID: ${{ needs.event-classifier.outputs.head_valid }}
      IDENTITY_VALID: ${{ needs.event-classifier.outputs.identity_valid }}
      RUN_EXPENSIVE: ${{ needs.event-classifier.outputs.run_expensive }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PUSH_SHA: ${{ github.event.after }}
      RAW_PUSH_SHA: ${{ github.sha }}
      HOST_TESTS_RESULT: ${{ needs.host-tests.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      EXTENDED_HOST_TESTS_RESULT: ${{ needs.extended-host-tests.result }}
      LEGACY_RESULT: ${{ needs.legacy.result }}
      PATCH_RELEASE_RESULT: ${{ needs.patch-release.result }}

    steps:
    - name: Render fail-closed combined Build summary
      run: |
        {
          echo "## Combined Build CI"
          echo
          echo "| Job | Conclusion |"
          echo "| --- | --- |"
          echo "| event-identity | $FALLBACK_IDENTITY_RESULT ($FALLBACK_KIND) |"
          echo "| event-classifier | $CLASSIFIER_RESULT ($CLASSIFICATION) |"
          echo "| host-tests | $HOST_TESTS_RESULT |"
          echo "| build | $BUILD_RESULT |"
          echo "| extended-host-tests | $EXTENDED_HOST_TESTS_RESULT |"
          echo "| legacy | $LEGACY_RESULT |"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$CLASSIFIER_RESULT" = "failure" ]; then
          if [ "$FALLBACK_IDENTITY_RESULT" = "success" ] && \
             [ "$GITHUB_EVENT_NAME" = "pull_request" ] && \
             [ "$FALLBACK_KIND" = "pull_request" ] && \
             [ "$FALLBACK_SHA" = "$PR_HEAD_SHA" ]; then
            for result in "$HOST_TESTS_RESULT" "$BUILD_RESULT" \
              "$EXTENDED_HOST_TESTS_RESULT" "$LEGACY_RESULT"
            do
              if [ "$result" != "success" ]; then
                echo "classifier-fallback Build worker did not succeed: $result" >&2
                exit 1
              fi
            done
            if [ "$PATCH_RELEASE_RESULT" != "skipped" ]; then
              echo "classifier-fallback PR unexpectedly ran publisher: $PATCH_RELEASE_RESULT" >&2
              exit 1
            fi
            echo "Build event classifier failed after exact-head fallback workers completed" >&2
            exit 1
          fi
          if [ "$FALLBACK_IDENTITY_RESULT" = "success" ] && \
             [ "$GITHUB_EVENT_NAME" = "push" ] && \
             [ "$FALLBACK_KIND" = "push" ] && \
             [ "$FALLBACK_SHA" = "$PUSH_SHA" ] && \
             [ "$FALLBACK_SHA" = "$RAW_PUSH_SHA" ]; then
            for result in "$HOST_TESTS_RESULT" "$BUILD_RESULT" \
              "$EXTENDED_HOST_TESTS_RESULT" "$LEGACY_RESULT"
            do
              if [ "$result" != "success" ]; then
                echo "classifier-fallback Build worker did not succeed: $result" >&2
                exit 1
              fi
            done
            if [ "$PATCH_RELEASE_RESULT" != "success" ]; then
              echo "classifier-fallback publisher did not succeed: $PATCH_RELEASE_RESULT" >&2
              exit 1
            fi
            echo "Build event classifier failed after exact-push fallback jobs completed" >&2
            exit 1
          fi
          for result in "$HOST_TESTS_RESULT" "$BUILD_RESULT" \
            "$EXTENDED_HOST_TESTS_RESULT" "$LEGACY_RESULT"
          do
            if [ "$result" != "skipped" ]; then
              echo "classifier failure without an exact fallback SHA started a worker: $result" >&2
              exit 1
            fi
          done
          if [ "$PATCH_RELEASE_RESULT" != "skipped" ]; then
            echo "classifier failure without a validated fallback SHA ran publisher: $PATCH_RELEASE_RESULT" >&2
            exit 1
          fi
          echo "Build event classifier failed without an exact fallback SHA" >&2
          exit 1
        fi
        if [ "$CLASSIFIER_RESULT" != "success" ]; then
          echo "Build event classifier did not complete: $CLASSIFIER_RESULT" >&2
          exit 1
        fi
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          if [ "$FALLBACK_IDENTITY_RESULT" != "success" ] || \
             [ "$FALLBACK_KIND" != "pull_request" ] || \
             [ -z "$FALLBACK_SHA" ] || [ "$FALLBACK_SHA" != "$PR_HEAD_SHA" ] || \
             [ "$FALLBACK_SHA" != "$CLASSIFIED_BUILD_SHA" ]; then
            echo "successful PR classification lacks coherent trusted event identity" >&2
            exit 1
          fi
        elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
          if [ "$FALLBACK_IDENTITY_RESULT" != "success" ] || \
             [ "$FALLBACK_KIND" != "push" ] || [ -z "$FALLBACK_SHA" ] || \
             [ "$FALLBACK_SHA" != "$PUSH_SHA" ] || \
             [ "$FALLBACK_SHA" != "$RAW_PUSH_SHA" ] || \
             [ "$FALLBACK_SHA" != "$CLASSIFIED_BUILD_SHA" ]; then
            echo "successful push classification lacks coherent trusted event identity" >&2
            exit 1
          fi
        else
          echo "successful classification has no trusted event identity mode" >&2
          exit 1
        fi
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && \
           [ "$FULL_FALLBACK" = "true" ] && [ "$HEAD_VALID" = "true" ] && \
           [ "$IDENTITY_VALID" = "false" ] && [ -n "$PR_HEAD_SHA" ] && \
           [ "$CLASSIFIED_BUILD_SHA" = "$PR_HEAD_SHA" ]; then
          for result in "$HOST_TESTS_RESULT" "$BUILD_RESULT" \
            "$EXTENDED_HOST_TESTS_RESULT" "$LEGACY_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "incomplete-base Build worker did not succeed: $result" >&2
              exit 1
            fi
          done
          if [ "$PATCH_RELEASE_RESULT" != "skipped" ]; then
            echo "incomplete-base PR unexpectedly ran publisher: $PATCH_RELEASE_RESULT" >&2
            exit 1
          fi
          echo "Build event classifier lacks authoritative PR base identity" >&2
          exit 1
        fi
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          if [ "$IDENTITY_VALID" != "true" ] || [ -z "$PR_HEAD_SHA" ] || \
             [ -z "$PR_BASE_SHA" ] || [ "$CLASSIFIED_BUILD_SHA" != "$PR_HEAD_SHA" ] || \
             [ "$CLASSIFIED_BASE_SHA" != "$PR_BASE_SHA" ]; then
            echo "Build event classifier PR identity is missing or stale" >&2
            exit 1
          fi
        elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
          if [ "$IDENTITY_VALID" != "true" ] || [ -z "$PUSH_SHA" ] || \
             [ "$CLASSIFIED_BUILD_SHA" != "$PUSH_SHA" ] || \
             [ -n "$CLASSIFIED_BASE_SHA" ] || \
             [ "$FALLBACK_IDENTITY_RESULT" != "success" ] || \
             [ "$FALLBACK_KIND" != "push" ] || [ "$FALLBACK_SHA" != "$PUSH_SHA" ]; then
            echo "Build event classifier push identity is missing or stale" >&2
            exit 1
          fi
        else
          echo "Build event classifier received an unsupported event" >&2
          exit 1
        fi

        if [ "$CLASSIFICATION" = "metadata-only" ]; then
          if [ "$RUN_EXPENSIVE" != "false" ]; then
            echo "metadata-only classification did not suppress workers" >&2
            exit 1
          fi
          for result in "$HOST_TESTS_RESULT" "$BUILD_RESULT" \
            "$EXTENDED_HOST_TESTS_RESULT" "$LEGACY_RESULT"
          do
            if [ "$result" != "skipped" ]; then
              echo "metadata-only Build worker was not skipped: $result" >&2
              exit 1
            fi
          done
          if [ "$PATCH_RELEASE_RESULT" != "skipped" ]; then
            echo "metadata-only Build unexpectedly ran publisher: $PATCH_RELEASE_RESULT" >&2
            exit 1
          fi
          exit 0
        fi

        if [ "$CLASSIFICATION" != "full" ] || [ "$RUN_EXPENSIVE" != "true" ]; then
          echo "unknown Build event classification output" >&2
          exit 1
        fi
        for result in "$HOST_TESTS_RESULT" "$BUILD_RESULT" "$EXTENDED_HOST_TESTS_RESULT" \
          "$LEGACY_RESULT"
        do
          if [ "$result" != "success" ]; then
            echo "required combined Build CI job did not succeed: $result" >&2
            exit 1
          fi
        done
        if [ "$GITHUB_EVENT_NAME" = "push" ]; then
          if [ "$PATCH_RELEASE_RESULT" != "success" ]; then
            echo "required master publisher did not succeed: $PATCH_RELEASE_RESULT" >&2
            exit 1
          fi
        elif [ "$PATCH_RELEASE_RESULT" != "skipped" ]; then
          echo "pull-request Build unexpectedly ran publisher: $PATCH_RELEASE_RESULT" >&2
          exit 1
        fi
