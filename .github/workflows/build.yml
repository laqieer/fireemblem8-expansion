          def utf8_len(value):
              return len(value.encode("utf-8"))

          def env(name, *, max_bytes):
              value = os.environ.get(name)
              if value is None or value == "":
                  fail(f"metadata-only summary missing {name}")
              if utf8_len(value) > max_bytes:
                  fail(f"metadata-only summary {name} exceeds bounds")
              return value

          def reject_duplicates(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      fail(f"metadata-only summary JSON repeats key {key!r}")
                  result[key] = value
              return result

          def reject_nonfinite_constant(value):
              fail(f"metadata-only summary JSON contains non-finite number {value}")

          def parse_strict_float(value):
              if len(value) > MAX_FLOAT_LITERAL_BYTES:
                  fail("metadata-only summary JSON float literal is too long")
              try:
                  decimal_value = decimal.Decimal(value)
                  float_value = float(decimal_value)
              except (decimal.InvalidOperation, OverflowError, ValueError):
                  fail(f"metadata-only summary JSON float is invalid: {value}")
              if not math.isfinite(float_value):
                  fail(f"metadata-only summary JSON float overflows: {value}")
              if decimal_value != 0 and float_value == 0:
                  fail(f"metadata-only summary JSON float underflows: {value}")
              return float_value

          def ensure_finite_numbers(value):
              if isinstance(value, float):
                  if not math.isfinite(value):
                      fail("metadata-only summary JSON contains non-finite float")
                  return
              if isinstance(value, dict):
                  for item in value.values():
                      ensure_finite_numbers(item)
                  return
              if isinstance(value, list):
                  for item in value:
                      ensure_finite_numbers(item)

          def parse_json_bytes(raw, *, label):
              if len(raw) > MAX_JSON_BYTES:
                  fail(f"{label} response exceeds bounds")
              try:
                  payload = json.loads(
                      raw.decode("utf-8"),
                      object_pairs_hook=reject_duplicates,
                      parse_constant=reject_nonfinite_constant,
                      parse_float=parse_strict_float,
                  )
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  fail(f"{label} response is not valid JSON: {error}")
              ensure_finite_numbers(payload)
              return payload

          def parse_positive_int(text, *, field):
              if INT_RE.fullmatch(text) is None:
                  fail(f"{field} is invalid")
              return int(text)

          def parse_positive_int_value(value, *, field):
              if (
                  isinstance(value, bool)
                  or not isinstance(value, int)
                  or value < 1
                  or value > MAX_SEQUENCE_VALUE
              ):
                  fail(f"{field} is invalid")
              return value

          def parse_sha(text, *, field):
              if SHA_RE.fullmatch(text) is None:
                  fail(f"{field} is invalid")
              return text

          def parse_nonempty_text(value, *, field):
              if not isinstance(value, str) or not value:
                  fail(f"{field} is invalid")
              return value

          def parse_optional_nonempty_text(value, *, field):
              if value is None:
                  return None
              return parse_nonempty_text(value, field=field)

          def parse_timestamp(text, *, field):
              if not isinstance(text, str) or TIMESTAMP_RE.fullmatch(text) is None:
                  fail(f"{field} is invalid")
              return text

          def parse_optional_timestamp(value, *, field):
              if value is None:
                  return None
              return parse_timestamp(value, field=field)

          def parse_repository(text):
              if REPO_RE.fullmatch(text) is None or utf8_len(text) > MAX_REPOSITORY_BYTES:
                  fail("metadata-only summary repository is invalid")
              owner, repo = text.split("/", 1)
              if owner in {".", ".."} or repo in {".", ".."}:
                  fail("metadata-only summary repository is invalid")
              return owner, repo

          def parse_api_base(text):
              if utf8_len(text) > MAX_API_URL_BYTES:
                  fail("metadata-only summary API base exceeds bounds")
              split = urllib.parse.urlsplit(text)
              if (
                  split.scheme not in {"http", "https"}
                  or not split.netloc
                  or split.username is not None
                  or split.password is not None
                  or split.query
                  or split.fragment
              ):
                  fail("metadata-only summary API base is invalid")
              return urllib.parse.urlunsplit(
                  (split.scheme, split.netloc, split.path.rstrip("/"), "", "")
              )

          def parse_pull_request_binding(value):
              if not isinstance(value, dict):
                  fail("metadata-only summary pull_requests entry is invalid")
              number = parse_positive_int_value(
                  value.get("number"),
                  field="metadata-only summary pull request number",
              )
              head = value.get("head")
              base = value.get("base")
              if not isinstance(head, dict) or not isinstance(base, dict):
                  fail("metadata-only summary pull request binding is invalid")
              return (
                  number,
                  parse_sha(
                      head.get("sha", ""),
                      field="metadata-only summary pull request head sha",
                  ),
                  parse_sha(
                      base.get("sha", ""),
                      field="metadata-only summary pull request base sha",
                  ),
              )

          def total_pages_for_count(total_count):
              if total_count == 0:
                  return 1
              page_count, remainder = divmod(total_count, MAX_PAGE_SIZE)
              if remainder:
                  page_count += 1
              return page_count

          def expected_page_count(total_count, current_page):
              total_pages = total_pages_for_count(total_count)
              if current_page > total_pages:
                  fail("metadata-only summary workflow runs page exceeded total_count")
              if total_pages == 1:
                  return total_count
              if current_page < total_pages:
                  return MAX_PAGE_SIZE
              remainder = total_count % MAX_PAGE_SIZE
              if remainder == 0:
                  return MAX_PAGE_SIZE
              return remainder

          def parse_page_relation_url(url, *, request_url, relation):
              split = urllib.parse.urlsplit(url)
              if (
                  split.scheme != request_url.scheme
                  or split.netloc != request_url.netloc
                  or split.username is not None
                  or split.password is not None
                  or split.path != request_url.path
                  or split.fragment
              ):
                  fail(
                      f"metadata-only summary workflow runs {relation} page escaped the reviewed endpoint"
                  )
              try:
                  query = urllib.parse.parse_qs(
                      split.query,
                      strict_parsing=True,
                      keep_blank_values=False,
                  )
              except ValueError as error:
                  fail(
                      f"metadata-only summary workflow runs {relation} page is malformed: {error}"
                  )
              if set(query) != {"event", "head_sha", "page", "per_page"}:
                  fail(
                      f"metadata-only summary workflow runs {relation} page has unexpected query keys"
                  )
              for key in query:
                  if len(query[key]) != 1:
                      fail(
                          f"metadata-only summary workflow runs {relation} page repeats a query parameter"
                      )
              if query["event"][0] != "pull_request":
                  fail(
                      f"metadata-only summary workflow runs {relation} page event drifted"
                  )
              if query["head_sha"][0] != head_sha:
                  fail(
                      f"metadata-only summary workflow runs {relation} page head drifted"
                  )
              if query["per_page"][0] != str(MAX_PAGE_SIZE):
                  fail(
                      f"metadata-only summary workflow runs {relation} page width drifted"
                  )
              return parse_positive_int(
                  query["page"][0],
                  field=f"metadata-only summary workflow runs {relation} page",
              )

          def parse_next_page(link, *, request_url, current_page, total_pages):
              if not link:
                  if total_pages == 1 or current_page == total_pages:
                      return None
                  fail("metadata-only summary workflow runs pagination truncated")
              if utf8_len(link) > MAX_HEADER_BYTES:
                  fail("metadata-only summary workflow runs Link header exceeds bounds")
              rels = {}
              position = 0
              while position < len(link):
                  match = re.match(
                      r'\s*<([^>]+)>\s*;\s*rel="([^"]+)"\s*(?:,\s*|$)',
                      link[position:],
                  )
                  if match is None:
                      fail("metadata-only summary workflow runs Link header is malformed")
                  url, relation = match.groups()
                  if relation in rels:
                      fail("metadata-only summary workflow runs Link header repeats a relation")
                  rels[relation] = url
                  position += match.end()
              unexpected_relations = set(rels) - {"first", "last", "next", "prev"}
              if unexpected_relations:
                  fail("metadata-only summary workflow runs Link header has an unexpected relation")
              next_page = None
              if "next" in rels:
                  next_page = parse_page_relation_url(
                      rels["next"],
                      request_url=request_url,
                      relation="next",
                  )
                  if next_page != current_page + 1:
                      fail("metadata-only summary workflow runs next page is not sequential")
                  if next_page > MAX_RUN_PAGES:
                      fail("metadata-only summary workflow runs exceed the reviewed pagination bound")
              if total_pages == 1:
                  fail("metadata-only summary workflow runs reported pagination for a single page")
              if current_page < total_pages:
                  if next_page is None:
                      fail("metadata-only summary workflow runs pagination truncated")
                  if "last" not in rels:
                      fail("metadata-only summary workflow runs last page is required")
              if current_page == total_pages and next_page is not None:
                  fail("metadata-only summary workflow runs reported an unexpected next page")
              if "last" in rels:
                  last_page = parse_page_relation_url(
                      rels["last"],
                      request_url=request_url,
                      relation="last",
                  )
                  if last_page != total_pages:
                      fail("metadata-only summary workflow runs last page drifted")
              if "first" in rels:
                  first_page = parse_page_relation_url(
                      rels["first"],
                      request_url=request_url,
                      relation="first",
                  )
                  if first_page != 1:
                      fail("metadata-only summary workflow runs first page drifted")
              if "prev" in rels:
                  prev_page = parse_page_relation_url(
                      rels["prev"],
                      request_url=request_url,
                      relation="prev",
                  )
                  if prev_page != current_page - 1:
                      fail("metadata-only summary workflow runs previous page is not sequential")
              return next_page

          def request_json(path, query_pairs, *, label):
              query = urllib.parse.urlencode(query_pairs)
              request_url = f"{api_base}{path}?{query}"
              def reject_redirect(self, request, fp, code, msg, headers):
                  raise urllib.error.HTTPError(
                      request.full_url,
                      code,
                      "redirects are forbidden",
                      headers,
                      fp,
                  )

              redirect_handler = type(
                  "NoRedirectHandler",
                  (urllib.request.HTTPRedirectHandler,),
                  {
                      "http_error_300": reject_redirect,
                      "http_error_301": reject_redirect,
                      "http_error_302": reject_redirect,
                      "http_error_303": reject_redirect,
                      "http_error_307": reject_redirect,
                      "http_error_308": reject_redirect,
                  },
              )
              request_opener = urllib.request.build_opener(redirect_handler())
              request = urllib.request.Request(
                  request_url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "workflow-pilot-summary",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="GET",
              )
              try:
                  with request_opener.open(request, timeout=20) as response:
                      raw = response.read(MAX_JSON_BYTES + 1)
                      if len(raw) > MAX_JSON_BYTES:
                          fail(f"{label} response exceeds bounds")
                      link = response.headers.get("Link", "")
              except urllib.error.HTTPError as error:
                  if 300 <= error.code < 400:
                      fail(f"{label} request rejected redirect: HTTP {error.code}")
                  fail(f"{label} request failed: HTTP {error.code}")
              except urllib.error.URLError as error:
                  fail(f"{label} request failed: {error.reason}")
              return (
                  parse_json_bytes(raw, label=label),
                  link,
                  urllib.parse.urlsplit(request_url),
              )

          def parse_visible_run(run, *, run_id):
              if not isinstance(run, dict):
                  fail("metadata-only summary workflow run is invalid")
              workflow_id = parse_positive_int_value(
                  run.get("workflow_id"),
                  field="metadata-only summary workflow run workflow_id",
              )
              run_number = parse_positive_int_value(
                  run.get("run_number"),
                  field="metadata-only summary workflow run run_number",
              )
              run_attempt = parse_positive_int_value(
                  run.get("run_attempt"),
                  field="metadata-only summary workflow run attempt",
              )
              event = parse_nonempty_text(
                  run.get("event"),
                  field="metadata-only summary workflow run event",
              )
              status = parse_nonempty_text(
                  run.get("status"),
                  field="metadata-only summary workflow run status",
              )
              conclusion = parse_optional_nonempty_text(
                  run.get("conclusion"),
                  field="metadata-only summary workflow run conclusion",
              )
              run_head_sha = parse_nonempty_text(
                  run.get("head_sha"),
                  field="metadata-only summary workflow run head sha",
              )
              path = parse_nonempty_text(
                  run.get("path"),
                  field="metadata-only summary workflow run path",
              )
              url = parse_nonempty_text(
                  run.get("url"),
                  field="metadata-only summary workflow run url",
              )
              created_at = parse_timestamp(
                  run.get("created_at"),
                  field="metadata-only summary workflow run created_at",
              )
              run_started_at = parse_optional_timestamp(
                  run.get("run_started_at"),
                  field="metadata-only summary workflow run run_started_at",
              )
              pull_requests = run.get("pull_requests")
              if not isinstance(pull_requests, list):
                  fail("metadata-only summary workflow run pull_requests is invalid")
              if SHA_RE.fullmatch(run_head_sha) is None:
                  fail("metadata-only summary workflow run head sha is invalid")
              path_matches = path == WORKFLOW_PATH_PREFIX or path.startswith(
                  WORKFLOW_PATH_PREFIX + "@"
              )
              split = urllib.parse.urlsplit(url)
              url_matches = split.path == f"{expected_run_url_prefix}/{run_id}"
              matches = 0
              for pull_request in pull_requests:
                  number, pull_head_sha, pull_base_sha = parse_pull_request_binding(
                      pull_request
                  )
                  if (
                      number == pr_number
                      and pull_head_sha == head_sha
                      and pull_base_sha == base_sha
                  ):
                      matches += 1
              if matches > 1:
                  fail("metadata-only summary workflow run pull request binding is ambiguous")
              exact_candidate = (
                  event == "pull_request"
                  and run_head_sha == head_sha
                  and path_matches
                  and url_matches
                  and matches == 1
              )
              is_current = run_id == current_run_id
              if event != "pull_request":
                  return {
                      "exact_candidate": False,
                      "is_current": is_current,
                      "conclusion": conclusion,
                      "created_at": created_at,
                      "run_attempt": run_attempt,
                      "run_id": run_id,
                      "run_number": run_number,
                      "run_started_at": run_started_at,
                      "status": status,
                      "workflow_id": workflow_id,
                  }
              if not exact_candidate:
                  return {
                      "exact_candidate": False,
                      "is_current": is_current,
                      "conclusion": conclusion,
                      "created_at": created_at,
                      "run_attempt": run_attempt,
                      "run_id": run_id,
                      "run_number": run_number,
                      "run_started_at": run_started_at,
                      "status": status,
                      "workflow_id": workflow_id,
                  }
              return {
                  "conclusion": conclusion,
                  "created_at": created_at,
                  "exact_candidate": True,
                  "is_current": is_current,
                  "run_attempt": run_attempt,
                  "run_id": run_id,
                  "run_number": run_number,
                  "run_started_at": run_started_at,
                  "status": status,
                  "workflow_id": workflow_id,
              }

          def parse_total_count(value):
              if (
                  isinstance(value, bool)
                  or not isinstance(value, int)
                  or value < 0
                  or value > MAX_TOTAL_RUNS
              ):
                  fail("metadata-only summary workflow runs total_count is invalid")
              return value

          def parse_prior_job(job, *, run_id):
              if not isinstance(job, dict):
                  fail("metadata-only summary prior run job is invalid")
              name = parse_nonempty_text(
                  job.get("name"),
                  field=f"metadata-only summary prior run {run_id} job name",
              )
              status = parse_nonempty_text(
                  job.get("status"),
                  field=f"metadata-only summary prior run {run_id} job status",
              )
              conclusion = parse_optional_nonempty_text(
                  job.get("conclusion"),
                  field=f"metadata-only summary prior run {run_id} job conclusion",
              )
              runner_name = job.get("runner_name")
              if runner_name is not None and (
                  not isinstance(runner_name, str) or not runner_name
              ):
                  fail("metadata-only summary prior run job fields are invalid")
              started_at = parse_optional_timestamp(
                  job.get("started_at"),
                  field=f"metadata-only summary prior run {run_id} job started_at",
              )
              return name, status, conclusion, runner_name, started_at

          def classify_prior_run(run_id, run_attempt):
              payload, link, _request_url = request_json(
                  f"/repos/{quoted_owner}/{quoted_repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs",
                  [("per_page", str(MAX_PAGE_SIZE)), ("page", "1")],
                  label=f"metadata-only summary prior run {run_id} jobs",
              )
              if link:
                  fail("metadata-only summary prior run jobs pagination is unsupported")
              if (
                  not isinstance(payload, dict)
                  or set(payload) != {"jobs", "total_count"}
              ):
                  fail("metadata-only summary prior run jobs response shape is invalid")
              total_count = parse_positive_int_value(
                  payload.get("total_count"),
                  field="metadata-only summary prior run jobs total_count",
              )
              jobs = payload.get("jobs")
              if (
                  not isinstance(jobs, list)
                  or len(jobs) != total_count
                  or total_count > MAX_PAGE_SIZE
              ):
                  fail("metadata-only summary prior run jobs pagination is invalid")
              by_name = {}
              for job in jobs:
                  (
                      name,
                      status,
                      conclusion,
                      runner_name,
                      started_at,
                  ) = parse_prior_job(job, run_id=run_id)
                  if name in by_name:
                      fail("metadata-only summary prior run jobs repeat a name")
                  by_name[name] = (status, conclusion, runner_name, started_at)
              names = frozenset(by_name)
              if names == METADATA_JOB_NAMES:
                  for name in ("extended-host-tests", "legacy", "patch-release"):
                      status, conclusion, runner_name, _started_at = by_name[name]
                      if (
                          status != "completed"
                          or conclusion != "skipped"
                          or runner_name not in {None, ""}
                      ):
                          fail(
                              f"metadata-only summary prior run {run_id} metadata job {name} is malformed"
                          )
                  return "metadata-only", by_name
              if names == FULL_JOB_NAMES:
                  return "full", by_name
              fail(f"metadata-only summary prior run {run_id} jobs have unexpected mode shape")

          def validate_authoritative_full_run(prior_run, by_name):
              if (
                  prior_run["status"] != "completed"
                  or prior_run["conclusion"] != "success"
              ):
                  fail(
                      "metadata-only summary newest prior full Build CI run did not complete successfully"
                  )
              for name in FULL_SUCCESS_JOB_NAMES:
                  status, conclusion, runner_name, started_at = by_name[name]
                  if (
                      status != "completed"
                      or conclusion != "success"
                      or runner_name in {None, ""}
                      or started_at is None
                  ):
                      fail(
                          f"metadata-only summary newest prior full Build CI job {name} is not a successful runner-backed completion"
                      )
              patch_status, patch_conclusion, patch_runner, _patch_started_at = by_name[
                  "patch-release"
              ]
              if (
                  patch_status != "completed"
                  or patch_conclusion != "skipped"
                  or patch_runner not in {None, ""}
              ):
                  fail(
                      "metadata-only summary newest prior full Build CI patch-release is invalid"
                  )

          pr_number = parse_positive_int(
              env("PR_NUMBER", max_bytes=MAX_PR_NUMBER_BYTES),
              field="metadata-only summary PR number",
          )
          head_sha = parse_sha(
              env("PR_HEAD_SHA", max_bytes=64),
              field="metadata-only summary PR head sha",
          )
          base_sha = parse_sha(
              env("PR_BASE_SHA", max_bytes=64),
              field="metadata-only summary PR base sha",
          )
          current_run_id = parse_positive_int(
              env("RUN_ID", max_bytes=MAX_PR_NUMBER_BYTES),
              field="metadata-only summary run id",
          )
          current_run_attempt = parse_positive_int(
              env("RUN_ATTEMPT", max_bytes=MAX_PR_NUMBER_BYTES),
              field="metadata-only summary run attempt",
          )
          current_run_number = parse_positive_int(
              env("RUN_NUMBER", max_bytes=MAX_PR_NUMBER_BYTES),
              field="metadata-only summary run number",
          )
          if current_run_attempt < 1:
              fail("metadata-only summary run attempt is invalid")
          owner, repo = parse_repository(
              env("GITHUB_REPOSITORY", max_bytes=MAX_REPOSITORY_BYTES)
          )
          quoted_owner = urllib.parse.quote(owner, safe="")
          quoted_repo = urllib.parse.quote(repo, safe="")
          api_base = parse_api_base(
              env("GITHUB_API_URL", max_bytes=MAX_API_URL_BYTES)
          )
          token = env("GITHUB_TOKEN", max_bytes=MAX_TOKEN_BYTES)
          expected_run_url_prefix = f"/repos/{quoted_owner}/{quoted_repo}/actions/runs"

          page = 1
          expected_total_count = None
          expected_workflow_id = None
          prior_runs = []
          current_run = None
          seen_run_ids = set()
          seen_run_numbers = {}
          previous_visible_run_number = None
          prior_full_run_id = None
          while True:
              payload, link, request_url = request_json(
                  f"/repos/{quoted_owner}/{quoted_repo}/actions/workflows/{WORKFLOW_FILENAME}/runs",
                  [
                      ("event", "pull_request"),
                      ("head_sha", head_sha),
                      ("per_page", str(MAX_PAGE_SIZE)),
                      ("page", str(page)),
                  ],
                  label=f"metadata-only summary workflow runs page {page}",
              )
              if (
                  not isinstance(payload, dict)
                  or set(payload) != {"total_count", "workflow_runs"}
              ):
                  fail("metadata-only summary workflow runs response shape is invalid")
              total_count = parse_total_count(payload.get("total_count"))
              workflow_runs = payload.get("workflow_runs")
              if (
                  not isinstance(workflow_runs, list)
                  or len(workflow_runs) > MAX_PAGE_SIZE
              ):
                  fail("metadata-only summary workflow runs pagination is invalid")
              if expected_total_count is None:
                  expected_total_count = total_count
              elif total_count != expected_total_count:
                  fail("metadata-only summary workflow runs total_count changed across pages")
              total_pages = total_pages_for_count(total_count)
              if len(workflow_runs) != expected_page_count(total_count, page):
                  fail("metadata-only summary workflow runs page cardinality is invalid")
              for run in workflow_runs:
                  if not isinstance(run, dict):
                      fail("metadata-only summary workflow run is invalid")
                  run_id = parse_positive_int_value(
                      run.get("id"),
                      field="metadata-only summary workflow run id",
                  )
                  if run_id in seen_run_ids:
                      if run_id == current_run_id:
                          fail("metadata-only summary current workflow run was duplicated")
                      fail("metadata-only summary workflow runs repeated a run")
                  seen_run_ids.add(run_id)
                  visible_run = parse_visible_run(run, run_id=run_id)
                  if expected_workflow_id is None:
                      expected_workflow_id = visible_run["workflow_id"]
                  elif visible_run["workflow_id"] != expected_workflow_id:
                      fail("metadata-only summary workflow runs workflow_id drifted")
                  prior_id = seen_run_numbers.get(visible_run["run_number"])
                  if prior_id is not None and prior_id != run_id:
                      fail("metadata-only summary workflow runs repeat a run_number")
                  seen_run_numbers[visible_run["run_number"]] = run_id
                  if previous_visible_run_number is not None and (
                      visible_run["run_number"] >= previous_visible_run_number
                  ):
                      fail("metadata-only summary workflow runs are not ordered by run_number")
                  previous_visible_run_number = visible_run["run_number"]
                  if visible_run["is_current"]:
                      if current_run is not None:
                          fail("metadata-only summary current workflow run was duplicated")
                      current_run = visible_run
                  elif visible_run["exact_candidate"]:
                      prior_runs.append(visible_run)
              visible_run_count = len(seen_run_ids)
              if visible_run_count > total_count:
                  fail("metadata-only summary workflow runs exceeded total_count")
              next_page = parse_next_page(
                  link,
                  request_url=request_url,
                  current_page=page,
                  total_pages=total_pages,
              )
              if next_page is None:
                  break
              page = next_page

          if current_run is None:
              fail("metadata-only summary current workflow run was not observed")
          if (
              current_run["run_number"] != current_run_number
              or current_run["run_attempt"] != current_run_attempt
          ):
              fail("metadata-only summary current workflow run sequence drifted")
          if not current_run["exact_candidate"]:
              fail("metadata-only summary current workflow run identity drifted")
          if (
              current_run["status"] != "in_progress"
              or current_run["conclusion"] is not None
          ):
              fail("metadata-only summary current workflow run status drifted")
          if current_run["run_started_at"] is None:
              fail("metadata-only summary current workflow run run_started_at is invalid")
          if current_run["created_at"] > current_run["run_started_at"]:
              fail("metadata-only summary current workflow run timestamps are inconsistent")
          for prior_run in prior_runs:
              if prior_run["run_number"] >= current_run_number:
                  fail("metadata-only summary current workflow run is superseded")
              mode, by_name = classify_prior_run(
                  prior_run["run_id"],
                  prior_run["run_attempt"],
              )
              if mode == "metadata-only":
                  continue
              validate_authoritative_full_run(prior_run, by_name)
              prior_full_run_id = prior_run["run_id"]
              break

          if prior_full_run_id is None:
              fail("metadata-only summary requires a prior successful complete full Build CI run")
        main()
        PY
          exit 0
        fi

        if [ "$CLASSIFICATION" != "full" ] || [ "$RUN_EXPENSIVE" != "true" ]; then
          echo "unknown Build event classification output" >&2
          exit 1
        fi
        for result in "$HOST_TESTS_RESULT" "$BUILD_RESULT" "$EXTENDED_HOST_TESTS_RESULT" \
          "$LEGACY_RESULT"
        do
          if [ "$result" != "success" ]; then
            echo "required combined Build CI job did not succeed: $result" >&2
            exit 1
          fi
        done
        if [ "$GITHUB_EVENT_NAME" = "push" ]; then
          if [ "$PATCH_RELEASE_RESULT" != "success" ]; then
            echo "required master publisher did not succeed: $PATCH_RELEASE_RESULT" >&2
            exit 1
          fi
        elif [ "$PATCH_RELEASE_RESULT" != "skipped" ]; then
          echo "pull-request Build unexpectedly ran publisher: $PATCH_RELEASE_RESULT" >&2
          exit 1
        fi
