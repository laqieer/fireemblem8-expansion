        SHELLOPTS: ''
      run: |
        private_dir=""
        base_image=""
        cleanup_download() {
          status="$?"
          trap - EXIT INT TERM
          set +e
          if [ "$status" -ne 0 ] && [ -n "$private_dir" ]; then
            /bin/chmod -R u+w -- "$private_dir" > /dev/null 2>&1 || true
            if [ -n "$base_image" ]; then
              /bin/rm -f -- "$base_image" > /dev/null 2>&1
            fi
            /usr/bin/rmdir -- "$private_dir" > /dev/null 2>&1 || true
          fi
          exit "$status"
        }
        trap cleanup_download EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        test -n "$BASEROM_URL"
        umask 077
        private_dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/patch-private.XXXXXXXXXX")"
        /bin/chmod 0700 "$private_dir"
        base_image="$private_dir/base.gba"
        /usr/bin/curl --fail --silent --location --proto '=https' --proto-redir '=https' --tlsv1.2 --output "$base_image" "$BASEROM_URL"
        /bin/chmod 0400 "$base_image"
        test -f "$base_image"
        test ! -L "$base_image"
        test "$(/usr/bin/stat -c %F "$base_image")" = "regular file"
        test "$(/usr/bin/stat -c %h "$base_image")" = 1
        test "$(/usr/bin/stat -c %a "$private_dir")" = 700
        test "$(/usr/bin/stat -c %a "$base_image")" = 400
        test "$(/usr/bin/stat -c %s "$base_image")" = 16777216
        printf 'base_path=%s\n' "$base_image" >> "$GITHUB_OUTPUT"
        trap - EXIT INT TERM

    - name: Create and verify patch artifact
      shell: /bin/bash --noprofile --norc -euo pipefail {0}
      env:
        BASE_IMAGE: ${{ steps.private-base.outputs.base_path }}
        BASH_ENV: ''
